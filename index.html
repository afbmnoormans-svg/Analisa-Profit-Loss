    <button class="btn" data-bkyear="__all">Semua</button>
    <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-left:8px">Outlet</span>
    ${[['all','Semua'],["De'Jawis","De'Jawis"],['Banquet','Banquet']].map(o=>
      `<button class="btn" data-bkoutlet="${o[0]}" style="${state.bkOutlet===o[0]?'background:var(--teal);border-color:var(--teal);color:#fff':''}">${o[1]}</button>`).join('')}
    <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-left:8px">Hari puasa</span>
    <select id="bkFrom" class="btn" style="padding:7px 10px">${Array.from({length:BK_MAXP},(_,i)=>`<option value="${i+1}"${i+1===state.bkFrom?' selected':''}>H${i+1}</option>`).join('')}</select>
    <span class="dim">sampai</span>
    <select id="bkTo" class="btn" style="padding:7px 10px">${Array.from({length:BK_MAXP},(_,i)=>`<option value="${i+1}"${i+1===state.bkTo?' selected':''}>H${i+1}</option>`).join('')}</select>
    <input id="bkSearch" class="btn" style="padding:7px 10px;min-width:210px" placeholder="cari nama tamu / paket" value="${esc(state.bkQ||'')}">
    <button class="btn" data-bkother="1" style="${state.bkOther?'background:var(--brass);border-color:var(--brass);color:#fff':''}">Ikutkan paket banquet lain jam buka</button>
    <button class="btn" data-bkcomp="1" style="${state.bkComp?'background:var(--clay);border-color:var(--clay);color:#fff':''}">Ikutkan compliment &amp; entertain</button>
    <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-left:8px">Angka rupiah</span>
    <div class="seg" style="background:#EEF2F5;border-color:var(--line);padding:2px">
      <button class="btn" data-bknet="0" style="${!state.bkNet?'background:var(--indigo);border-color:var(--indigo);color:#fff':''}">Kotor</button>
      <button class="btn" data-bknet="1" style="${state.bkNet?'background:var(--indigo);border-color:var(--indigo);color:#fff':''}">Nett &divide;1,21</button>
    </div>
    <span class="dim" style="font-size:12px;margin-left:auto">${nf.format(ag.n)} transaksi terpilih</span>
   </div></div>`;

  h+=`<div class="banner mt"><strong>Dasar angka: revenue ${bkMode()}.</strong> Nilai di jurnal transaksi masih kotor — sudah termasuk service charge 10% dan government tax 11%, faktor gabungan <strong>1,21</strong>. Nett revenue dihitung <em>kotor &divide; 1,21</em>. Tombol <em>Kotor / Nett</em> di kartu filter mengubah seluruh angka rupiah pada tab ini${state.bkNet?', dan sekarang semuanya sudah nett':''}. Tabel perbandingan antar tahun di bawah selalu menampilkan keduanya sekaligus.</div>`;
  if(state.bkComp) h+=`<div class="banner mt"><strong>Compliment &amp; entertain ikut dihitung.</strong> Baris compliment, officer check, dan entertain yang menempel pada bill berisi item bukber ikut masuk sebagai nilai negatif, sehingga revenue yang tampil sudah bersih dari bukber yang digratiskan. Pax tidak ditambah — tamu gratisan sudah terhitung di baris penjualannya. Baris ini juga ikut tersaring oleh filter tahun, outlet, hari, dan pencarian nama.</div>`;
  if(state.bkOther) h+=`<div class="banner mt"><strong>Mode diperluas.</strong> Paket banquet lain yang jatuh di bulan puasa dan dijual pada jam buka (mulai pukul 16.00) — misalnya <em>dinner package</em> atau <em>meeting package</em> sore — ikut dihitung. Ini berguna untuk melihat total belanja rombongan di bulan puasa, tetapi angkanya tidak lagi murni paket bukber. Matikan tombolnya untuk kembali ke angka bukber saja.</div>`;
  if(!ag.n) return h+`<div class="banner mt">Tidak ada transaksi pada kombinasi filter ini. Longgarkan rentang hari puasa atau kosongkan kotak pencarian.</div>`;

  /* ---------- KPI ---------- */
  const gtab=bkGuestTable(list);
  const named=gtab.filter(r=>r.name!=='(tanpa nama)');
  const disc=bkPot(yrs,'disc'), comp=bkCompSum();
  const filterPolos = (state.bkOutlet==='all' && state.bkFrom===1 && state.bkTo===BK_MAXP && !q && !state.bkOther);
  h+=`<div class="grid g4 mt">
    ${kpi('teal','Total pax',nf.format(ag.q),`<span class="dim">${yrs.join(' · ')}</span>`,`${nf.format(ag.n)} baris transaksi &middot; ${ag.days} hari ada penjualan`)}
    ${kpi('indigo','Revenue '+bkMode(),rpjt(bkM(ag.a)),`<span class="dim">${state.bkComp?'sudah dikurangi compliment &amp; entertain':'sebelum diskon &amp; compliment'}</span>`,`Rata-rata ${rp(bkM(ag.days?ag.a/ag.days:0))} per hari jualan &middot; ${bkModeNote()}${state.bkComp?' &middot; nilai digratiskan '+rpjt(bkM(Math.abs(ag.comp)))+' sudah dipotong':''}`)}
    ${kpi('brass','Rata-rata per pax',rp(bkM(ag.avg)),`<span class="dim">revenue ${bkMode()} dibagi pax</span>`,`Kotor ${rp(ag.avg)} &rarr; nett ${rp(bkNet(ag.avg))}`)}
    ${kpi('clay','Nama tamu tercatat',nf.format(named.length),`<span class="dim">dari ${nf.format(gtab.length)} kelompok</span>`,`${named.filter(r=>r.ys.length>1).length} nama muncul di lebih dari satu tahun`)}
  </div>`;
  h+=`<div class="grid g4 mt">
    ${kpi('clay','Service charge + pajak',rpjt(bkTaxPart(ag.a)),`<span class="dim">21% dari nilai kotor${state.bkComp?' setelah compliment':''}</span>`,`Bagian yang bukan pendapatan hotel: kotor ${rpjt(ag.a)} &rarr; nett ${rpjt(bkNet(ag.a))}`)}
    ${kpi('brass','Diskon + compliment',rpjt(bkM(Math.abs(disc+comp))),`<span class="dim">${state.bkComp?'compliment sudah masuk hitungan di atas':'belum ikut terhitung di atas'}</span>`,`Diskon ${rpjt(bkM(Math.abs(disc)))} &middot; compliment &amp; entertain ${rpjt(bkM(Math.abs(comp)))} dari ${bkCompRows().length} baris`)}
    ${kpi('teal','Revenue bersih '+bkMode(),rpjt(bkM(ag.a+disc+(state.bkComp?0:comp))),`<span class="dim">setelah potongan</span>`,`Setara ${rp(bkM(ag.q?(ag.a+disc+(state.bkComp?0:comp))/ag.q:0))} per pax`)}
    ${kpi('indigo','Hari jualan aktif',nf.format(ag.days),`<span class="dim">rata-rata ${nf.format(Math.round(ag.days?ag.q/ag.days:0))} pax/hari</span>`,`Hari tanpa transaksi bukber tidak dihitung`)}
  </div>`;
  if(!filterPolos) h+=`<div class="banner mt">Angka <strong>diskon</strong> dan <strong>compliment</strong> dihitung per musim penuh (semua outlet, semua hari) karena menempel pada nomor bill, bukan pada baris item. Saat filter outlet, hari, atau pencarian aktif, dua angka itu tidak ikut menyempit.</div>`;

  /* ---------- perbandingan antar tahun ---------- */
  const perY={}; BKY.forEach(y=>{
    const l=bkFilter({years:[y]}), sale=l.filter(t=>t.c!==2);
    perY[y]={all:bkAgg(sale), dj:bkAgg(sale.filter(t=>t.o==="De'Jawis")), bq:bkAgg(sale.filter(t=>t.o==='Banquet')),
             comp:bkCompSum({years:[y]}),
             guests:bkGuestTable(l).filter(r=>r.name!=='(tanpa nama)').length};
  });
  const cur=yrs[yrs.length-1], prev=yrs.length>1?yrs[yrs.length-2]:null;
  const netOf=y=>perY[y].all.a+((BK.pot[y]||{}).disc||0)+perY[y].comp;
  const mets=[
    ['Pax bukber', y=>perY[y].all.q, n=>nf.format(n), true],
    ['Revenue kotor <span class="dim">(termasuk 21%)</span>', y=>perY[y].all.a, rp, true],
    ['&nbsp;&nbsp;Service charge 10% + tax 11%', y=>bkTaxPart(perY[y].all.a), rp, null],
    ['<strong>Revenue nett</strong> <span class="dim">(kotor &divide; 1,21)</span>', y=>bkNet(perY[y].all.a), rp, true],
    ['Rata-rata kotor per pax', y=>perY[y].all.avg, rp, true],
    ['Rata-rata nett per pax', y=>bkNet(perY[y].all.avg), rp, true],
    ['Harga paket dewasa <span class="dim">(kotor)</span>', y=>bkPrice(y), rp, null],
    ['Harga paket dewasa <span class="dim">(nett)</span>', y=>bkNet(bkPrice(y)), rp, null],
    ["Pax De'Jawis", y=>perY[y].dj.q, n=>nf.format(n), true],
    ["Revenue De'Jawis", y=>perY[y].dj.a, rp, true],
    ['Pax Banquet', y=>perY[y].bq.q, n=>nf.format(n), true],
    ['Revenue Banquet', y=>perY[y].bq.a, rp, true],
    ['Porsi Banquet % revenue', y=>perY[y].all.a?perY[y].bq.a/perY[y].all.a*100:0, n=>pc(n), 'pp'],
    ['Hari ada penjualan', y=>perY[y].all.days, n=>nf.format(n), true],
    ['Rata-rata pax per hari', y=>perY[y].all.days?perY[y].all.q/perY[y].all.days:0, n=>nf1.format(n), true],
    ['Jumlah transaksi', y=>perY[y].all.n, n=>nf.format(n), null],
    ['Nama tamu tercatat', y=>perY[y].guests, n=>nf.format(n), true],
    ['Diskon di bill bukber', y=>Math.abs((BK.pot[y]||{}).disc||0), rp, false],
    ['Compliment &amp; entertain <span class="dim">(bukber digratiskan)</span>', y=>Math.abs(perY[y].comp), rp, false],
    ['Revenue bersih kotor', y=>netOf(y), rp, true],
    ['<strong>Revenue bersih nett</strong> <span class="dim">(&divide; 1,21)</span>', y=>bkNet(netOf(y)), rp, true],
    ['Revenue bersih nett per pax', y=>perY[y].all.q?bkNet(netOf(y))/perY[y].all.q:0, rp, true]
  ];
  h+=`<div class="card mt"><div class="hd"><h3>Musim bukber antar tahun</h3><span class="hint">${yrs.join(' · ')}${state.bkOutlet!=='all'?' &middot; outlet '+esc(state.bkOutlet):''}${(state.bkFrom>1||state.bkTo<BK_MAXP)?' &middot; hari H'+state.bkFrom+'–H'+state.bkTo:''}</span></div>
   <div class="bd tight"><table class="t">${th(['Ukuran'].concat(yrs).concat([prev?('&Delta; '+cur+' vs '+prev):'&Delta;']))}<tbody>
   ${mets.map(m=>{
     const nm=m[0], fn=m[1], f=m[2], good=m[3];
     const d = !prev ? '<span class="delta flat">—</span>'
             : good==='pp' ? chipPP(fn(cur),fn(prev),true)
             : good===null ? `<span class="delta flat">${fn(prev)?((fn(cur)-fn(prev)>=0?'+':'')+nf1.format(grow(fn(cur),fn(prev)))+'%'):'—'}</span>`
             : chip(fn(cur),fn(prev),good)
                    ;
     return `<tr><td>${nm}</td>${yrs.map(y=>`<td class="num">${f(fn(y))}</td>`).join('')}<td class="num">${d}</td></tr>`;
   }).join('')}
   </tbody></table></div></div>`;

  /* ---------- grafik pax & revenue per tahun ---------- */
  h+=`<div class="grid g2 mt">
   <div class="card"><div class="hd"><h3>Pax per tahun menurut outlet</h3></div><div class="bd">
     ${barChart({labels:yrs, height:250,
       fmt:n=>nf.format(Math.round(n)), tipFmt:n=>nf.format(Math.round(n))+' pax',
       series:[{name:"De'Jawis Resto",color:'#0D6E64',values:yrs.map(y=>perY[y].dj.q)},
               {name:'Banquet',color:'#2F4A7A',values:yrs.map(y=>perY[y].bq.q)}]})}
   </div></div>
   <div class="card"><div class="hd"><h3>Revenue ${bkMode()} per tahun menurut outlet</h3><span class="hint">${bkModeNote()}</span></div><div class="bd">
     ${barChart({labels:yrs, height:250,
       series:[{name:"De'Jawis Resto",color:'#0D6E64',values:yrs.map(y=>bkM(perY[y].dj.a))},
               {name:'Banquet',color:'#2F4A7A',values:yrs.map(y=>bkM(perY[y].bq.a))}]})}
   </div></div>
  </div>`;

  /* ---------- pax per hari puasa ---------- */
  const lo=state.bkFrom, hi=state.bkTo;
  const days=[]; for(let p=lo;p<=hi;p++) days.push(p);
  const byDay={}; yrs.forEach(y=>{ byDay[y]={}; });
  const byDayAll={};
  list.forEach(t=>{ byDay[t.y][t.p]=(byDay[t.y][t.p]||0)+t.q; byDayAll[t.p]=(byDayAll[t.p]||0)+t.q; });
  const peak=days.slice().sort((a,b)=>(byDayAll[b]||0)-(byDayAll[a]||0))[0];
  h+=`<div class="card mt"><div class="hd"><h3>Pax per hari puasa — puasa ke berapa yang ramai</h3><span class="hint">H1 = hari puasa pertama, disejajarkan antar tahun</span></div>
   <div class="bd">${barChart({labels:days.map(p=>'H'+p), height:300, padB:34,
     fmt:n=>nf.format(Math.round(n)), tipFmt:n=>nf.format(Math.round(n))+' pax',
     series:yrs.map(y=>({name:y,color:BK_COL[y],values:days.map(p=>byDay[y][p]||0)}))})}
   <p class="dim" style="margin:8px 0 0">Puncak gabungan ada di <strong>puasa hari ke-${peak}</strong> dengan ${nf.format(byDayAll[peak]||0)} pax.</p>
   </div></div>`;

  /* ---------- sepuluh harian ---------- */
  const seg=[[1,10,'Sepuluh hari pertama'],[11,20,'Sepuluh hari kedua'],[21,BK_MAXP,'Sepuluh hari terakhir']];
  h+=`<div class="card mt"><div class="hd"><h3>Pola sepuluh harian</h3><span class="hint">pax dan porsinya terhadap musim</span></div>
   <div class="bd tight"><table class="t">${th(['Bagian'].concat(yrs.map(y=>y+' pax')).concat(['Total pax','Porsi']))}<tbody>
   ${seg.map(s=>{
     const tot=list.filter(t=>t.p>=s[0]&&t.p<=s[1]).reduce((a,t)=>a+t.q,0);
     return `<tr><td>${s[2]} <span class="dim">(H${s[0]}–H${Math.min(s[1],hi)})</span></td>
       ${yrs.map(y=>`<td class="num">${nf.format(list.filter(t=>t.y===y&&t.p>=s[0]&&t.p<=s[1]).reduce((a,t)=>a+t.q,0))}</td>`).join('')}
       <td class="num">${nf.format(tot)}</td><td class="num">${pc(ag.q?tot/ag.q*100:0)}</td></tr>`;
   }).join('')}
   </tbody></table></div></div>`;

  /* ---------- hari pekan + hari terbesar ---------- */
  const byW=[0,0,0,0,0,0,0], dayCount=[0,0,0,0,0,0,0], seen={};
  list.forEach(t=>{ byW[t.w]+=t.q; if(!seen[t.d]){seen[t.d]=1; dayCount[t.w]++;} });
  const bigMap={};
  list.forEach(t=>{ const k=t.y+'|'+t.d+'|'+t.p; bigMap[k]=(bigMap[k]||0)+t.q; });
  const big=Object.keys(bigMap).map(k=>{const p=k.split('|');return {y:p[0],d:p[1],p:+p[2],q:bigMap[k]};})
    .sort((a,b)=>b.q-a.q).slice(0,12);
  h+=`<div class="grid g2 mt">
   <div class="card"><div class="hd"><h3>Pola hari dalam pekan</h3><span class="hint">rata-rata pax per hari buka</span></div><div class="bd">
     ${barChart({labels:BK_DOW.map(d=>d.slice(0,3)), height:240,
       fmt:n=>nf.format(Math.round(n)), tipFmt:n=>nf.format(Math.round(n))+' pax',
       series:[{name:'Rata-rata pax per hari',color:'#0D6E64',values:byW.map((v,i)=>dayCount[i]?v/dayCount[i]:0)},
               {name:'Total pax',color:'#D3DBE2',opacity:.9,values:byW}]})}
   </div></div>
   <div class="card"><div class="hd"><h3>Dua belas hari terbesar</h3><span class="hint">gabungan outlet terpilih</span></div>
    <div class="bd tight"><table class="t">${th(['Tanggal','Tahun','Hari puasa','Hari','Pax'])}<tbody>
    ${big.map(b=>`<tr><td>${bkDate(b.d)}</td><td>${b.y}</td><td class="num">H${b.p}</td><td>${BK_DOW[new Date(b.d+'T00:00:00').getDay()===0?6:new Date(b.d+'T00:00:00').getDay()-1]}</td><td class="num"><strong>${nf.format(b.q)}</strong></td></tr>`).join('')}
    </tbody></table></div></div>
  </div>`;

  /* ---------- paket ---------- */
  const byDesc={};
  list.forEach(t=>{ const k=t.o+' — '+t.desc; if(!byDesc[k]) byDesc[k]={k:k,q:0,a:0,n:0,ys:{}}; byDesc[k].q+=t.q; byDesc[k].a+=t.a; byDesc[k].n++; byDesc[k].ys[t.y]=1; });
  const dl=Object.keys(byDesc).map(k=>byDesc[k]).sort((a,b)=>b.a-a.a);
  h+=`<div class="card mt"><div class="hd"><h3>Item / paket yang terjual</h3><span class="hint">${dl.length} nama item</span></div>
   <div class="bd tight"><table class="t">${th(['Outlet — nama item','Tahun','Pax','Revenue '+bkMode(),'Rata-rata/pax','Porsi revenue'])}<tbody>
   ${dl.map(d=>`<tr><td>${esc(d.k)}</td><td class="dim">${Object.keys(d.ys).sort().join(', ')}</td>
     <td class="num">${nf.format(d.q)}</td><td class="num">${rp(bkM(d.a))}</td>
     <td class="num">${d.q?rp(bkM(d.a/d.q)):'—'}</td><td class="num">${pc(ag.a?d.a/ag.a*100:0)}</td></tr>`).join('')}
   </tbody></table></div></div>`;

  /* ---------- database nama tamu ---------- */
  const show=gtab.slice(0,200);
  h+=`<div class="card mt"><div class="hd"><h3>Database nama tamu bukber</h3><span class="hint">${nf.format(gtab.length)} kelompok · ditampilkan ${show.length} teratas</span></div>
   <div class="bd" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:0">
     <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)">Urutkan</span>
     ${[['pax','Pax'],['rev','Revenue'],['visit','Jumlah kunjungan'],['tahun','Tahun aktif'],['nama','Nama']].map(s=>
       `<button class="btn" data-bksort="${s[0]}" style="${state.bkSort===s[0]?'background:var(--indigo);border-color:var(--indigo);color:#fff':''}">${s[1]}</button>`).join('')}
     <button class="btn" data-bkrepeat="1" style="${state.bkRepeat?'background:var(--clay);border-color:var(--clay);color:#fff':''}">Hanya yang datang lebih dari satu tahun</button>
     <button class="btn" id="csvBkGuest" style="margin-left:auto">Unduh CSV — daftar nama tamu</button>
   </div>
   <div class="bd tight"><table class="t">${th(['Nama tamu / rombongan','Tahun aktif','Kunjungan','Pax','Revenue '+bkMode(),'Rata-rata/pax'].concat(state.bkComp?['Digratiskan']:[]).concat(['Terakhir datang']))}<tbody>
   ${show.map(r=>`<tr><td>${esc(r.name)}${r.ys.length>1?' <span class="delta up">berulang</span>':''}</td>
     <td class="dim">${r.ys.join(', ')}</td><td class="num">${nf.format(r.n)}</td>
     <td class="num"><strong>${nf.format(r.q)}</strong></td><td class="num">${rp(bkM(r.a))}</td>
     <td class="num">${r.q?rp(bkM(r.a/r.q)):'—'}</td>${state.bkComp?`<td class="num">${r.free?rp(bkM(r.free)):'—'}</td>`:''}<td>${bkDate(r.last)}</td></tr>`).join('')}
   </tbody></table>
   <p class="dim" style="margin:10px 0 0">Nama dirapikan otomatis: awalan &ldquo;BUKBER&rdquo; dan tanggal di belakang nama dibuang, sehingga &ldquo;BUKBER SD SEMESTA // 08 APRIL&rdquo; dan &ldquo;BUKBER SD SEMESTA // 15 APRIL&rdquo; menjadi satu nama. Transaksi tanpa nama di jurnal dikumpulkan sebagai <em>(tanpa nama)</em>.</p>
   </div></div>`;

  /* ---------- rincian transaksi ---------- */
  const tx=list.slice().sort((a,b)=> a.d===b.d ? a.t.localeCompare(b.t) : a.d.localeCompare(b.d));
  const txShow=tx.slice(0,250);
  h+=`<div class="card mt"><div class="hd"><h3>Rincian transaksi</h3><span class="hint">${nf.format(tx.length)} baris · ditampilkan ${txShow.length} pertama</span>
    <button class="btn" id="csvBkTx" style="margin-left:auto">Unduh CSV — semua transaksi terpilih</button></div>
   <div class="bd tight"><table class="t">${th(['Tanggal','H','Jam','Outlet','Item','Nama tamu','Qty','Amount kotor','Amount nett'])}<tbody>
   ${txShow.map(t=>`<tr${(t.a<0)?' style="color:var(--clay)"':''}><td>${bkDate(t.d)}</td><td class="num">H${t.p}</td><td>${t.t}</td>
     <td>${t.o}</td><td>${esc(t.desc)}${t.c===1?'':` <span class="dim">(${bkJenis(t.c)})</span>`}</td><td>${esc(t.g||'—')}</td>
     <td class="num">${nf.format(t.q)}</td><td class="num">${rp(t.a)}</td><td class="num">${rp(bkNet(t.a))}</td></tr>`).join('')}
   </tbody></table></div></div>`;

  /* ---------- bacaan ---------- */
  h+=bkNarr(perY,yrs,byDayAll,days,byW,dayCount,ag,named);
  return h;
}

function bkNarr(perY,yrs,byDayAll,days,byW,dayCount,ag,named){
  const cur=yrs[yrs.length-1], first=yrs[0];
  const seg=[1,2,3].map(i=>{const lo=(i-1)*10+1, hi=i===3?BK_MAXP:i*10;
    let s=0; days.forEach(p=>{ if(p>=lo&&p<=hi) s+=byDayAll[p]||0; }); return s;});
  const segTot=seg[0]+seg[1]+seg[2]||1;
  const top3=days.slice().sort((a,b)=>(byDayAll[b]||0)-(byDayAll[a]||0)).slice(0,3);
  const avgW=byW.map((v,i)=>dayCount[i]?v/dayCount[i]:0);
  let bw=0,ww=0; avgW.forEach((v,i)=>{ if(v>avgW[bw]) bw=i; if(v<avgW[ww]) ww=i; });
  const dCur=perY[cur], dFirst=perY[first];
  const rev=[], pax=[];
  yrs.forEach(y=>{ rev.push(perY[y].all.a); pax.push(perY[y].all.q); });
  return `<div class="card mt"><div class="hd"><h3>Bacaan cepat</h3><span class="hint">dihitung ulang mengikuti filter</span></div><div class="bd">
   <ul style="margin:6px 0 0;padding-left:18px;line-height:1.6">
    <li><strong>Yang benar-benar masuk ke hotel.</strong> Dari revenue kotor ${rpjt(ag.a)} pada filter ini, ${rpjt(bkTaxPart(ag.a))} adalah service charge 10% dan government tax 11%. Nett revenue-nya ${rpjt(bkNet(ag.a))}, dan setelah diskon serta compliment tinggal ${rpjt(bkNet(ag.a+bkPot(yrs,'disc')+(state.bkComp?0:bkCompSum())))} — setara ${rp(ag.q?bkNet(ag.a+bkPot(yrs,'disc')+(state.bkComp?0:bkCompSum()))/ag.q:0)} per pax.</li>
    <li><strong>Volume turun, harga naik.</strong> Pax ${first} ${nf.format(dFirst.all.q)} menjadi ${nf.format(dCur.all.q)} pada ${cur} (${grow(dCur.all.q,dFirst.all.q)>=0?'+':''}${nf1.format(grow(dCur.all.q,dFirst.all.q))}%), sementara rata-rata nett per pax bergerak dari ${rp(bkNet(dFirst.all.avg))} ke ${rp(bkNet(dCur.all.avg))} (${grow(dCur.all.avg,dFirst.all.avg)>=0?'+':''}${nf1.format(grow(dCur.all.avg,dFirst.all.avg))}%). Revenue nett ${cur} ${rpjt(bkNet(dCur.all.a))} dibanding ${rpjt(bkNet(dFirst.all.a))} di ${first} — angka kotornya ${rpjt(dCur.all.a)} dan ${rpjt(dFirst.all.a)}.</li>
    <li><strong>Ramainya di paruh kedua puasa.</strong> Sepuluh hari pertama hanya ${pc(seg[0]/segTot*100)} dari pax, sepuluh hari kedua ${pc(seg[1]/segTot*100)}, dan sepuluh hari terakhir ${pc(seg[2]/segTot*100)}. Tiga hari puasa paling ramai: H${top3[0]} (${nf.format(byDayAll[top3[0]]||0)} pax), H${top3[1]} (${nf.format(byDayAll[top3[1]]||0)}), H${top3[2]} (${nf.format(byDayAll[top3[2]]||0)}). Artinya minggu pertama masih longgar untuk promo, dan tenaga terbesar perlu disiapkan mulai hari ke-11.</li>
    <li><strong>Hari terbaik ${BK_DOW[bw]}, terlemah ${BK_DOW[ww]}</strong> — rata-rata ${nf.format(Math.round(avgW[bw]))} pax berbanding ${nf.format(Math.round(avgW[ww]))} pax per hari buka.</li>
    <li><strong>Basis tamu berulang masih tipis.</strong> Dari ${nf.format(named.length)} nama yang tercatat, hanya ${named.filter(r=>r.ys.length>1).length} yang muncul di lebih dari satu tahun. Daftar nama di tabel atas bisa diekspor jadi bahan penawaran musim berikutnya, terutama rombongan besar yang tahun ini tidak kembali.</li>
    <li><strong>Kualitas pencatatan nama.</strong> ${pc(ag.q?(ag.q-bkGuestTable(bkFilter()).filter(r=>r.name==='(tanpa nama)').reduce((s,r)=>s+r.q,0))/ag.q*100:0)} pax punya nama tamu di jurnal. Sisanya masuk tanpa nama sehingga tidak bisa dipakai untuk penawaran ulang — ini yang paling murah diperbaiki di kasir.</li>
   </ul></div></div>`;
}

function bkExportGuests(){
  const arr=bkGuestTable(bkFilter());
  const rows=[['Nama tamu','Tahun aktif','Jumlah tahun','Kunjungan','Pax','Revenue kotor','Revenue nett','Rata-rata nett per pax','Nilai digratiskan','Pertama datang','Terakhir datang']];
  arr.forEach(r=>rows.push([r.name,r.ys.join(' '),r.ys.length,r.n,r.q,Math.round(r.a),Math.round(bkNet(r.a)),r.q?Math.round(bkNet(r.a)/r.q):0,Math.round(r.free||0),r.first,r.last]));
  download('Bukber-database-tamu.csv',toCSV(rows));
}
function bkExportTx(){
  const arr=bkFilter().slice().sort((a,b)=> a.d===b.d ? a.t.localeCompare(b.t) : a.d.localeCompare(b.d));
  const rows=[['Tahun','Tanggal','Hari puasa','Hari','Jam','Outlet','Item','Jenis','Nama tamu','Qty','Amount kotor','Amount nett']];
  arr.forEach(t=>rows.push([t.y,t.d,t.p,BK_DOW[t.w],t.t,t.o,t.desc,bkJenis(t.c),t.g,t.q,Math.round(t.a),Math.round(bkNet(t.a))]));
  download('Bukber-transaksi.csv',toCSV(rows));
}

/* ============================================================
   SHELL APLIKASI
   ============================================================ */
const TABS=[
  {id:'ringkasan',label:'Ringkasan',     fn:tabRingkasan},
  {id:'fb',       label:'F&B Dept',      fn:tabFB},
  {id:'outlet',   label:'Outlet F&B',     fn:tabOutlet},
  {id:'cos',      label:'Cost of Sales',  fn:tabCOS},
  {id:'biaya',    label:'Biaya F&B',     fn:tabBiaya},
  {id:'bulan',    label:'Per Bulan',    fn:tabBulan},
  {id:'tren',     label:'Tren Bulanan',   fn:tabTren},
  {id:'ytd',      label:'Kumulatif',    fn:tabYTD},
  {id:'room',     label:'Room Div',      fn:tabRoom},
  {id:'bukber',   label:'Bukber',        fn:tabBukber},
  {id:'tahun',    label:'Antar Tahun',    fn:tabTahun},
  {id:'insight',  label:'Temuan',        fn:tabInsight},
  {id:'data',     label:'Data',         fn:tabData}
];

function renderChrome(){
  /* tahun */
  document.getElementById('yearBtns').innerHTML = YEARS.map(y=>
    `<button data-year="${y}" aria-pressed="${y===state.year}">${y}</button>`).join('');
  document.getElementById('yearLabel').textContent = state.year;
  /* bulan */
  document.getElementById('ribbon').innerHTML = monthsIn(state.year).map(m=>
    `<button class="mchip ${isClosed(state.year,m)?'':'provisional'}" data-month="${m}" aria-pressed="${m===state.month}">
      ${MSHORT[m-1]}<span class="my">${isClosed(state.year,m)?'closing':'belum'}</span></button>`).join('');
  /* tab */
  document.getElementById('tabs').innerHTML = TABS.map((t,i)=>
    `<button class="tabbtn" role="tab" data-tab="${t.id}" aria-selected="${t.id===state.tab}"><span class="ix">${String(i+1).padStart(2,'0')}</span>${t.label}</button>`).join('');
}

function render(){
  renderChrome();
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===state.mode));
  document.querySelectorAll('[data-cmp]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cmp===state.cmp));
  const tab=TABS.find(t=>t.id===state.tab)||TABS[0];
  const c=document.getElementById('content');
  c.innerHTML = `<div class="panel on"><div class="print-conf">Dokumen rahasia — Hotel Noormans Semarang${VIEWER?' &middot; dibuka oleh '+esc(VIEWER):''}</div>${tab.fn()}
    <footer class="foot">Sumber: file P&amp;L bulanan Hotel Noormans Semarang, sheet 01. Profit &amp; Lost OK dan 01.2 F&amp;B Dept. Seluruh nilai adalah angka net sesuai file asli. Catatan yang Anda ketik tersimpan di peramban ini saja.</footer></div>`;
  bindEditable(c);
  window.scrollTo({top:0,behavior:'instant'});
  const pp=document.getElementById('pPos');
  if(pp) pp.textContent = `${TABS.findIndex(t=>t.id===state.tab)+1} / ${TABS.length}`;
}

/* ---- CSV ---- */
function toCSV(rows){ return rows.map(r=>r.map(c=>{
  const s=String(c==null?'':c);
  return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}).join(';')).join('\n'); }
function download(name,text){
  const b=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportSheet(sheet){
  const y=state.year, ms=monthsIn(y);
  const rows=[['Uraian'].concat(ms.map(m=>MONTHS[m-1]+' aktual')).concat(ms.map(m=>MONTHS[m-1]+' budget'))];
  Object.keys(DATA.labels[sheet]).map(Number).sort((a,b)=>a-b).forEach(r=>{
    const name=lbl(sheet,r);
    if(!name||/^accounting period|^description$/i.test(name)) return;
    rows.push([name].concat(ms.map(m=>v(sheet,r,A,y,m))).concat(ms.map(m=>v(sheet,r,B,y,m))));
  });
  download(`${sheet==='fb'?'FB-Dept':'PnL-Hotel'}-${y}.csv`, toCSV(rows));
}
function exportAllYears(){
  const rows=[['Tahun','Bulan','Status'].concat(
    Object.keys(DATA.labels.fb).map(Number).sort((a,b)=>a-b)
      .map(r=>lbl('fb',r)).filter(n=>n&&!/^accounting period|^description$/i.test(n)))];
  const cols=Object.keys(DATA.labels.fb).map(Number).sort((a,b)=>a-b)
    .filter(r=>{const n=lbl('fb',r); return n&&!/^accounting period|^description$/i.test(n);});
  YEARS.forEach(y=>monthsIn(y).forEach(m=>{
    rows.push([y,MONTHS[m-1],isClosed(y,m)?'closing':'belum closing']
      .concat(cols.map(r=>v('fb',r,A,y,m))));
  }));
  download('FB-Dept-semua-tahun.csv', toCSV(rows));
}
function exportMonth(m){
  const y=state.year;
  const rows=[['Sheet','Uraian','Aktual','Budget','Bulan lalu','Tahun lalu']];
  ['pl','fb'].forEach(sheet=>{
    Object.keys(DATA.labels[sheet]).map(Number).sort((a,b)=>a-b).forEach(r=>{
      const name=lbl(sheet,r);
      if(!name||/^accounting period|^description$/i.test(name)) return;
      rows.push([sheet==='fb'?'01.2 F&B Dept':'01. Profit & Lost OK',name,
        v(sheet,r,A,y,m),v(sheet,r,B,y,m), m>1?v(sheet,r,A,y,m-1):v(sheet,r,LM,y,m), v(sheet,r,LY,y,m)]);
    });
  });
  download(`PnL-${MONTHS[m-1]}-${y}.csv`, toCSV(rows));
}

/* ---- event ---- */
document.addEventListener('click',e=>{
  const y=e.target.closest('[data-year]');
  if(y){ state.year=y.dataset.year; state.month=lastClosed(state.year); state.detailMonth=state.month; render(); return; }
  const m=e.target.closest('[data-month]');
  if(m){ state.month=+m.dataset.month; state.detailMonth=state.month; render(); return; }
  const md=e.target.closest('[data-mode]');
  if(md){ state.mode=md.dataset.mode; render(); return; }
  const cp=e.target.closest('[data-cmp]');
  if(cp){ state.cmp=cp.dataset.cmp; render(); return; }
  const ry=e.target.closest('[data-ryear]');
  if(ry){ state.roomYear=ry.dataset.ryear; render(); return; }
  const rp_=e.target.closest('[data-rpreset]');
  if(rp_){
    const cm=rmClosedMonths(state.roomYear);
    if(rp_.dataset.rpreset==='ytd'){ state.roomFrom=1; state.roomTo=cm.length?cm[cm.length-1]:12; }
    else { state.roomFrom=1; state.roomTo=12; }
    render(); return;
  }
  const sc=e.target.closest('[data-scope]');
  if(sc){ state.yoyScope=sc.dataset.scope; render(); return; }
  const bky=e.target.closest('[data-bkyear]');
  if(bky){
    const yy=bky.dataset.bkyear;
    if(!state.bkYears) state.bkYears=BKY.slice();
    if(yy==='__all'){ state.bkYears=BKY.slice(); }
    else {
      const i=state.bkYears.indexOf(yy);
      if(i>=0){ if(state.bkYears.length>1) state.bkYears.splice(i,1); }
      else { state.bkYears.push(yy); state.bkYears.sort(); }
    }
    render(); return;
  }
  const bko=e.target.closest('[data-bkoutlet]');
  if(bko){ state.bkOutlet=bko.dataset.bkoutlet; render(); return; }
  const bks=e.target.closest('[data-bksort]');
  if(bks){ state.bkSort=bks.dataset.bksort; render(); return; }
  if(e.target.closest('[data-bkrepeat]')){ state.bkRepeat=!state.bkRepeat; render(); return; }
  if(e.target.closest('[data-bkother]')){ state.bkOther=!state.bkOther; render(); return; }
  if(e.target.closest('[data-bkcomp]')){ state.bkComp=!state.bkComp; render(); return; }
  const bkn=e.target.closest('[data-bknet]');
  if(bkn){ state.bkNet = bkn.dataset.bknet==='1'; render(); return; }
  if(e.target.id==='csvBkGuest'){ bkExportGuests(); return; }
  if(e.target.id==='csvBkTx'){ bkExportTx(); return; }
  const tb=e.target.closest('[data-tab]');
  if(tb){ state.tab=tb.dataset.tab; render(); return; }
  if(e.target.id==='dmPrev'){ const cm=state.detailMonth||state.month; if(cm>1){state.detailMonth=cm-1; render();} return; }
  if(e.target.id==='dmNext'){ const cm=state.detailMonth||state.month; const mx=Math.max(...monthsIn(state.year)); if(cm<mx){state.detailMonth=cm+1; render();} return; }
  if(e.target.id==='csvBulan'){ exportMonth(state.detailMonth||state.month); return; }
  if(e.target.id==='csvFB'){ exportSheet('fb'); return; }
  if(e.target.id==='csvPL'){ exportSheet('pl'); return; }
  if(e.target.id==='csvAll'){ exportAllYears(); return; }
  if(e.target.id==='resetNotes'){ resetNotes(); return; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='detailMonthSel'){ state.detailMonth=+e.target.value; render(); return; }
  if(e.target.id==='rFrom'){ state.roomFrom=+e.target.value; if(state.roomTo<state.roomFrom) state.roomTo=state.roomFrom; render(); return; }
  if(e.target.id==='rTo'){ state.roomTo=+e.target.value; if(state.roomFrom>state.roomTo) state.roomFrom=state.roomTo; render(); return; }
  if(e.target.id==='bkFrom'){ state.bkFrom=+e.target.value; if(state.bkTo<state.bkFrom) state.bkTo=state.bkFrom; render(); return; }
  if(e.target.id==='bkTo'){ state.bkTo=+e.target.value; if(state.bkFrom>state.bkTo) state.bkFrom=state.bkTo; render(); return; }
});
document.addEventListener('input',e=>{
  if(e.target.id!=='bkSearch') return;
  state.bkQ=e.target.value;
  render();
  const el=document.getElementById('bkSearch');
  if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
});

/* ---- mode presentasi ---- */
function setPresent(on){
  document.body.classList.toggle('present',on);
  document.getElementById('presBtn').textContent = on?'Keluar presentasi':'Mode presentasi';
  if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  if(!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  render();
}
document.getElementById('presBtn').addEventListener('click',()=>setPresent(!document.body.classList.contains('present')));
document.getElementById('pExit').addEventListener('click',()=>setPresent(false));
function stepTab(d){
  const i=TABS.findIndex(t=>t.id===state.tab);
  const n=(i+d+TABS.length)%TABS.length;
  state.tab=TABS[n].id; render();
}
document.getElementById('pPrev').addEventListener('click',()=>stepTab(-1));
document.getElementById('pNext').addEventListener('click',()=>stepTab(1));
document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(!document.body.classList.contains('present')) return;
  if(e.key==='ArrowRight'){ stepTab(1); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ stepTab(-1); e.preventDefault(); }
  if(e.key==='Escape'){ setPresent(false); }
});

/* ---- start ---- */
if(!YEARS.some(y=>closedMonths(y).length<12)) state.yoyScope='penuh';
state.roomYear = RM_YEARS[RM_YEARS.length-1];
(function(){ const cm=rmClosedMonths(state.roomYear); state.roomFrom=1; state.roomTo=cm.length?cm[cm.length-1]:12; })();
state.month = lastClosed(state.year);
state.detailMonth = state.month;
render();

}
