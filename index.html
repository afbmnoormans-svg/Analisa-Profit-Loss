<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Analisa P&amp;L — Hotel Noormans Semarang</title>
<style>
:root{
  --ink:#131C24;
  --ink-2:#3A4B58;
  --muted:#6B7C8A;
  --line:#D3DBE2;
  --line-soft:#E6EBF0;
  --ground:#E9EDF1;
  --card:#FFFFFF;
  --teal:#0D6E64;
  --teal-soft:#E0F0ED;
  --teal-deep:#084F47;
  --clay:#A4243B;
  --clay-soft:#FAE7EA;
  --brass:#9A6B23;
  --brass-soft:#FBF0DC;
  --indigo:#2F4A7A;
  --indigo-soft:#E7ECF6;
  --r:10px;
  --shadow:0 1px 2px rgba(19,28,36,.06), 0 8px 24px -12px rgba(19,28,36,.18);
  --mono:ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", "Segoe UI Mono", "Roboto Mono", Consolas, "Liberation Mono", Menlo, monospace;
  --disp:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  background:var(--ground);
  color:var(--ink);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--disp);margin:0;letter-spacing:-.015em;line-height:1.2}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- shell ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 80px}
header.top{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(180deg,#0F1922 0%, #14212C 100%);
  color:#EAF0F4;
  border-bottom:3px solid var(--teal);
}
.top-inner{max-width:1440px;margin:0 auto;padding:14px 20px 0}
.brandrow{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.brand h1{font-size:20px;font-weight:800;color:#fff}
.brand .sub{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#8FA6B4;font-weight:600;margin-top:2px}
.topright{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:2px}

.seg{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:2px;gap:2px}
.seg button{
  font:inherit;font-size:12px;font-weight:600;color:#B4C6D2;background:none;border:0;
  padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;font-family:var(--body)
}
.seg button[aria-pressed="true"]{background:#EAF0F4;color:#12212C}
.seg button:hover:not([aria-pressed="true"]){color:#fff}
.seg-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7C93A2;font-weight:700;margin-right:6px;align-self:center}

.ghost{
  font:inherit;font-size:12px;font-weight:600;font-family:var(--body);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#D6E2EA;
  padding:6px 12px;border-radius:8px;cursor:pointer
}
.ghost:hover{background:rgba(255,255,255,.14);color:#fff}

/* month ribbon */
.ribbon{display:flex;gap:0;margin:12px 0 0;overflow-x:auto;scrollbar-width:none}
.ribbon::-webkit-scrollbar{display:none}
.mchip{
  flex:1 0 auto;min-width:72px;text-align:center;background:none;border:0;cursor:pointer;
  padding:8px 6px 9px;font-family:var(--body);color:#93A9B7;font-size:12px;font-weight:600;
  border-bottom:3px solid transparent;position:relative;transition:color .12s
}
.mchip .my{display:block;font-family:var(--mono);font-size:10px;color:#6D8493;letter-spacing:.06em}
.mchip:hover{color:#DCE7EE}
.mchip[aria-pressed="true"]{color:#fff;border-bottom-color:var(--teal)}
.mchip.provisional::after{
  content:"";position:absolute;top:6px;right:10px;width:5px;height:5px;border-radius:50%;
  background:var(--brass);box-shadow:0 0 0 2px rgba(154,107,35,.28)
}

/* tabs */
nav.tabs{background:#0B141B;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:59}
.tabs-inner{max-width:1440px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tabbtn{
  font-family:var(--body);font-size:12px;font-weight:600;color:#8CA3B2;background:none;border:0;
  padding:11px 11px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent
}
.tabbtn:hover{color:#E3EDF3}
.tabbtn[aria-selected="true"]{color:#fff;border-bottom-color:var(--brass);background:rgba(255,255,255,.04)}
.tabbtn .ix{font-family:var(--mono);font-size:10px;color:#5E7686;margin-right:6px}
.tabbtn[aria-selected="true"] .ix{color:var(--brass)}

/* ---------- panels ---------- */
.panel{display:none;padding-top:22px}
.panel.on{display:block}
.panel h2.ph{font-size:23px;font-weight:800}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:5px}
.lead{color:var(--ink-2);max-width:88ch;margin:8px 0 0;font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.hd{
  padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap
}
.card>.hd h3{font-size:14.5px;font-weight:700}
.card>.hd .hint{font-size:11.5px;color:var(--muted);margin-left:auto}
.card>.bd{padding:16px}
.card>.bd.tight{padding:0}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1080px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.mt{margin-top:16px}
.mt-lg{margin-top:26px}

/* KPI */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.kpi.k-teal::before{background:var(--teal)}
.kpi.k-clay::before{background:var(--clay)}
.kpi.k-brass::before{background:var(--brass)}
.kpi.k-indigo::before{background:var(--indigo)}
.kpi .lb{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .vl{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:5px;line-height:1.15}
.kpi .vl.sm{font-size:18px}
.kpi .dl{font-size:12px;color:var(--ink-2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.kpi .note{font-size:11.5px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line-soft);padding-top:6px}

.delta{font-family:var(--mono);font-size:12px;font-weight:600;padding:1px 6px;border-radius:5px;white-space:nowrap}
.up{background:var(--teal-soft);color:var(--teal-deep)}
.down{background:var(--clay-soft);color:var(--clay)}
.flat{background:#EEF1F4;color:var(--muted)}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t thead th{
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;
  background:#F4F7F9;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2
}
table.t td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.t tr.sec td{background:#F4F7F9;font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
table.t tr.tot td{font-weight:700;background:#FAFCFD;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.t tr.grand td{font-weight:800;background:#12212C;color:#EAF0F4;border:0}
table.t tr.grand td.n{color:#fff}
table.t tbody tr:hover td{background:#F7FAFB}
table.t tbody tr.grand:hover td{background:#12212C}
.scroll{overflow:auto;max-height:640px;border-radius:0 0 var(--r) var(--r)}
.pos{color:var(--teal-deep)}
.neg{color:var(--clay)}
.dim{color:var(--muted)}

.bar-cell{position:relative}
.bar-cell .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--teal-soft);border-radius:3px;z-index:0}
.bar-cell .fill.neg{background:var(--clay-soft)}
.bar-cell span{position:relative;z-index:1}

/* chart */
.chart{width:100%;display:block}
.chart text{font-family:var(--body);fill:var(--muted)}
.chart .axis{stroke:var(--line-soft);stroke-width:1}
.chart .zero{stroke:var(--line);stroke-width:1}
.chart .lbl{font-size:10px}
.chart .val{font-family:var(--mono);font-size:9.5px;fill:var(--ink-2)}
.chart rect.b{cursor:pointer}
.chart rect.b:hover{opacity:.82}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}

#tip{
  position:fixed;z-index:200;pointer-events:none;background:#12212C;color:#EAF0F4;
  border-radius:7px;padding:8px 10px;font-size:12px;box-shadow:0 8px 26px rgba(0,0,0,.3);
  display:none;max-width:280px;line-height:1.45
}
#tip b{color:#fff;font-family:var(--mono);font-weight:600}
#tip .tl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#8FA6B4;font-weight:700;display:block;margin-bottom:3px}

/* notes / editable */
.note-box{
  background:#FBFCFD;border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--ink-2);line-height:1.6
}
.note-box.teal{border-left-color:var(--teal)}
.note-box.clay{border-left-color:var(--clay)}
.note-box h4{font-size:12.5px;margin-bottom:5px;color:var(--ink)}
[contenteditable="true"]{outline:none;border-radius:4px;transition:background .12s}
[contenteditable="true"]:hover{background:#F0F6F5;box-shadow:0 0 0 3px #F0F6F5}
[contenteditable="true"]:focus{background:#fff;box-shadow:0 0 0 2px var(--teal)}
.edit-hint{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.edit-hint::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass)}

.btn{
  font-family:var(--body);font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);
  color:var(--ink-2);padding:6px 11px;border-radius:7px;cursor:pointer
}
.btn:hover{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-soft)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-deep);color:#fff}

.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:20px}
.pill.g{background:var(--teal-soft);color:var(--teal-deep)}
.pill.r{background:var(--clay-soft);color:var(--clay)}
.pill.y{background:var(--brass-soft);color:var(--brass)}
.pill.b{background:var(--indigo-soft);color:var(--indigo)}

.banner{
  background:var(--brass-soft);border:1px solid #E8D4AC;border-left:4px solid var(--brass);
  border-radius:8px;padding:12px 15px;font-size:13px;color:#6B4A16;margin-bottom:18px
}
.banner strong{color:#4E3610}

/* ledger strip (signature) */
.ledger{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 8px}
.ledger .lg-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.ledger .lg-hd h3{font-size:12.5px;font-weight:700}
.ledger .lg-hd .sub{font-size:11px;color:var(--muted)}
.ledger .lg-hd .sw{margin-left:auto;display:flex;gap:12px;font-size:11px;color:var(--ink-2)}

/* presentation mode */
body.present{background:#0B141B}
body.present header.top{border-bottom-color:var(--brass)}
body.present .wrap{max-width:100%;padding:0 32px 40px}
body.present .panel h2.ph{font-size:30px}
body.present .kpi .vl{font-size:26px}
body.present table.t{font-size:14px}
body.present .card{border-color:#C7D2DB}
.pres-nav{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:120;display:none;
  background:#12212C;border:1px solid rgba(255,255,255,.14);border-radius:30px;padding:7px 10px;
  gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)
}
body.present .pres-nav{display:flex}
.pres-nav button{
  background:rgba(255,255,255,.1);border:0;color:#DCE7EE;font-family:var(--body);font-size:12px;font-weight:600;
  padding:6px 13px;border-radius:20px;cursor:pointer
}
.pres-nav button:hover{background:rgba(255,255,255,.22);color:#fff}
.pres-nav .pos-i{font-family:var(--mono);font-size:11.5px;color:#8FA6B4;padding:0 6px}

footer.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}



/* ---------- penanda dokumen rahasia ---------- */
.print-conf{display:none;margin-bottom:14px;padding:8px 12px;border:2px solid #A4243B;color:#A4243B;
  font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
@media print{ .print-conf{display:block!important} }

@media print{
  header.top,nav.tabs,.pres-nav,.btn,.ghost{display:none!important}
  .panel{display:block!important;page-break-after:always}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* data sheet 01.1 Room Div, struktur sama: [aktual, budget, tahun lalu, YTD aktual, YTD budget, bulan lalu] */
const ROOM = window.__R;

/* ---- nomor baris di sheet asli ---- */
const PL = {

/* ---------- state ---------- */
const YEARS = Object.keys(DATA.years).sort();
const state = {

  roomYear: null,       // tab Room Division punya filter sendiri

  bkQ: '',

  bkNet: false,        // false = angka kotor, true = nett (dibagi 1,21)

  bkRepeat: false
};

/* ---------- akses data ---------- */
function has(y,m){ return DATA.years[y] && DATA.years[y][String(m)]; }
function raw(y,m,sheet,row){
  const md = has(y,m); if(!md) return null;
  const r = md[sheet][String(row)];
  return r || null;
}
function v(sheet,row,idx,y,m){
  y = y||state.year; m = m||state.month;
  const r = raw(y,m,sheet,row);
  return r ? (r[idx]||0) : 0;
}
const pl = (row,idx,y,m)=>v('pl',row,idx===undefined?A:idx,y,m);
const fb = (row,idx,y,m)=>v('fb',row,idx===undefined?A:idx,y,m);

/* bulan sudah closing? -> ada cost of sales / payroll */
function isClosed(y,m){
  if(!has(y,m)) return false;
  return (fb(FB.cosTotal,A,y,m) > 0) || (fb(FB.payTotal,A,y,m) > 0);
}
function banqBevMonths(y){ return monthsIn(y).filter(m=>fb(FB.bBanquet,A,y,m)>0); }
function monthsIn(y){ return Object.keys(DATA.years[y]||{}).map(Number).sort((a,b)=>a-b); }
function closedMonths(y){ return monthsIn(y).filter(m=>isClosed(y,m)); }
function lastClosed(y){ const c=closedMonths(y); return c.length?c[c.length-1]:monthsIn(y)[0]; }

/* nilai "sekarang" & "pembanding" mengikuti toggle periode + pembanding */
function cur(sheet,row,y,m){
  y=y||state.year; m=m||state.month;
  return state.mode==='ytd' ? v(sheet,row,YA,y,m) : v(sheet,row,A,y,m);
}
function ref(sheet,row,y,m){
  y=y||state.year; m=m||state.month;
  if(state.mode==='ytd'){
    if(state.cmp==='bud') return v(sheet,row,YB,y,m);
    if(state.cmp==='lm')  return m>1 ? v(sheet,row,YA,y,m-1) : 0;
    let s=0; for(let i=1;i<=m;i++) s+=v(sheet,row,LY,y,i); return s;
  }
  if(state.cmp==='bud') return v(sheet,row,B,y,m);
  if(state.cmp==='lm')  return m>1 ? v(sheet,row,A,y,m-1) : v(sheet,row,LM,y,m);
  return v(sheet,row,LY,y,m);
}
function cmpLabel(){
  return state.cmp==='bud' ? 'Budget' : state.cmp==='lm' ? (state.mode==='ytd'?'YTD bulan lalu':'Bulan lalu') : (state.mode==='ytd'?'YTD tahun lalu':'Tahun lalu');
}
function periodLabel(y,m){
  y=y||state.year; m=m||state.month;
  return state.mode==='ytd' ? `Januari–${MONTHS[m-1]} ${y}` : `${MONTHS[m-1]} ${y}`;
}

/* ---------- format ---------- */
const nf = new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
function rp(n){ if(!isFinite(n)) return '—'; return 'Rp' + nf.format(Math.round(n)); }
function jt(n){
  if(!isFinite(n)||n===0) return '0';
  const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(2).replace('.',',')+' M';
  if(a>=1e6) return (n/1e6).toFixed(1).replace('.',',')+' jt';
  if(a>=1e3) return Math.round(n/1e3)+' rb';
  return nf.format(Math.round(n));
}
function rpjt(n){ return isFinite(n)? 'Rp'+jt(n) : '—'; }
function pc(n,d){ d=d===undefined?1:d; if(!isFinite(n)) return '—'; return (d===1?nf1.format(n):nf2.format(n))+'%'; }
function ratio(a,b){ return (b&&isFinite(a/b)) ? a/b*100 : 0; }
function grow(a,b){ return b? (a-b)/Math.abs(b)*100 : (a?100:0); }

/* delta chip; goodUp=true berarti naik itu bagus */
function chip(curV,refV,goodUp,opt){
  opt=opt||{};
  if(refV===0 && curV===0) return '<span class="delta flat">—</span>';
  if(refV===0) return '<span class="delta flat">n/a</span>';
  const g = grow(curV,refV);
  const good = goodUp ? g>=0 : g<=0;
  const cls = Math.abs(g)<0.05 ? 'flat' : (good?'up':'down');
  const sign = g>0?'+':'';
  return `<span class="delta ${cls}">${sign}${nf1.format(g)}%</span>`;
}
function chipPP(curV,refV,goodUp){
  const d = curV-refV;
  const good = goodUp ? d>=0 : d<=0;
  const cls = Math.abs(d)<0.05 ? 'flat' : (good?'up':'down');
  return `<span class="delta ${cls}">${d>0?'+':''}${nf1.format(d)} pp</span>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function lbl(sheet,row){ return (DATA.labels[sheet][String(row)]||'').trim(); }

/* ---------- catatan yang bisa diedit ---------- */
/* catatan disimpan terenkripsi memakai kunci yang sama dengan isi laporan */

  const val = NOTES[id]!==undefined ? NOTES[id] : html;

}
function bindEditable(root){

}
function resetNotes(){
  if(!confirm('Kembalikan semua catatan ke teks awal? Catatan yang Anda tulis akan hilang.')) return;

}

/* ============================================================
   MESIN DIAGRAM (SVG, tanpa library)
   ============================================================ */
let tipEl;
function tipShow(e,html){
  tipEl = tipEl || document.getElementById('tip');
  tipEl.innerHTML = html; tipEl.style.display='block';
  const r = tipEl.getBoundingClientRect();
  let x = e.clientX+14, y = e.clientY-10;
  if(x+r.width>window.innerWidth-10) x = e.clientX-r.width-14;
  if(y+r.height>window.innerHeight-10) y = window.innerHeight-r.height-10;
  if(y<8) y=8;
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
}
function tipHide(){ if(tipEl) tipEl.style.display='none'; }
document.addEventListener('mouseover',e=>{
  const t = e.target.closest('[data-tip]');
  if(t) tipShow(e, t.getAttribute('data-tip'));
});
document.addEventListener('mousemove',e=>{
  const t = e.target.closest('[data-tip]');
  if(t) tipShow(e, t.getAttribute('data-tip')); else tipHide();
});
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget || !e.relatedTarget.closest('[data-tip]')) tipHide(); });

/* diagram batang berkelompok */
function barChart(cfg){
  const W = cfg.width||900, H = cfg.height||280;
  const padL = cfg.padL||58, padR = 14, padT = 18, padB = cfg.padB||34;
  const labels = cfg.labels, series = cfg.series;
  const iw = W-padL-padR, ih = H-padT-padB;
  let max = 0, min = 0;
  series.forEach(s=>s.values.forEach(x=>{ if(isFinite(x)){ max=Math.max(max,x); min=Math.min(min,x);} }));
  if(max===0&&min===0) max=1;
  max = max*1.12; if(min<0) min = min*1.12;
  const span = max-min || 1;
  const y0 = padT + ih*(max/span);
  const n = labels.length, gw = iw/n, inner = gw*0.72, bw = inner/series.length;
  const fmtV = cfg.fmt || jt;
  let g = '';
  /* gridlines */
  for(let i=0;i<=4;i++){
    const yy = padT + ih*i/4;
    const val = max - span*i/4;
    g += `<line class="axis" x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}"/>`;
    g += `<text class="lbl" x="${padL-7}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${fmtV(val)}</text>`;
  }
  g += `<line class="zero" x1="${padL}" y1="${y0.toFixed(1)}" x2="${W-padR}" y2="${y0.toFixed(1)}"/>`;
  labels.forEach((lb,i)=>{
    const gx = padL + gw*i + (gw-inner)/2;
    series.forEach((s,si)=>{

      if(!isFinite(val)) return;

      const yy = val>=0 ? y0-h : y0;
      const x = gx + bw*si;
      const tipHtml = `<span class="tl">${esc(lb)}</span>${series.map(ss=>`${esc(ss.name)}: <b>${(cfg.tipFmt||rp)(ss.values[i])}</b>`).join('<br>')}${cfg.tipExtra&&cfg.tipExtra[i]?'<br>'+cfg.tipExtra[i]:''}`;
      g += `<rect class="b" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(1,bw-1.5).toFixed(1)}" height="${Math.max(0.6,h).toFixed(1)}" fill="${s.color}" ${s.opacity?`opacity="${s.opacity}"`:''} rx="1.5" data-tip="${esc(tipHtml)}"/>`;
    });
    g += `<text class="lbl" x="${(padL+gw*i+gw/2).toFixed(1)}" y="${H-padB+15}" text-anchor="middle">${esc(lb)}</text>`;
  });

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${g}</svg>

/* diagram garis (untuk persentase / margin) */
function lineChart(cfg){
  const W = cfg.width||900, H = cfg.height||260;
  const padL = 46, padR = 14, padT = 16, padB = 34;
  const labels = cfg.labels, series = cfg.series;
  const iw = W-padL-padR, ih = H-padT-padB;
  let max=-Infinity, min=Infinity;
  series.forEach(s=>s.values.forEach(x=>{ if(x!==null&&isFinite(x)){ max=Math.max(max,x); min=Math.min(min,x);} }));
  if(!isFinite(max)){max=1;min=0;}
  const pad=(max-min)*0.18||1; max+=pad; min=Math.max(0,min-pad);
  if(cfg.min!==undefined) min=cfg.min;
  const span=max-min||1;
  const n=labels.length, step = n>1 ? iw/(n-1) : 0;
  const X=i=>padL+step*i, Y=x=>padT+ih*(1-(x-min)/span);
  let g='';
  for(let i=0;i<=4;i++){
    const yy=padT+ih*i/4, val=max-span*i/4;
    g+=`<line class="axis" x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}"/>`;
    g+=`<text class="lbl" x="${padL-7}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${nf1.format(val)}%</text>`;
  }
  if(cfg.target!==undefined && cfg.target>=min && cfg.target<=max){
    const ty=Y(cfg.target);
    g+=`<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W-padR}" y2="${ty.toFixed(1)}" stroke="#A4243B" stroke-width="1.2" stroke-dasharray="5 4"/>`;
    g+=`<text class="lbl" x="${W-padR-2}" y="${(ty-5).toFixed(1)}" text-anchor="end" fill="#A4243B">${cfg.targetLabel||('target '+nf1.format(cfg.target)+'%')}</text>`;
  }
  series.forEach(s=>{
    const pts=[]; s.values.forEach((val,i)=>{ if(val!==null&&isFinite(val)) pts.push([X(i),Y(val)]); });
    if(!pts.length) return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
  });
  labels.forEach((lb,i)=>{
    g+=`<text class="lbl" x="${X(i).toFixed(1)}" y="${H-padB+15}" text-anchor="middle">${esc(lb)}</text>`;
    const rows = series.filter(s=>s.values[i]!==null&&isFinite(s.values[i]))
      .map(s=>`${esc(s.name)}: <b>${nf2.format(s.values[i])}%</b>`).join('<br>');
    if(!rows) return;
    series.forEach(s=>{ const val=s.values[i];
      if(val!==null&&isFinite(val)) g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(val).toFixed(1)}" r="3.4" fill="#fff" stroke="${s.color}" stroke-width="2"/>`; });
    g+=`<rect x="${(X(i)-step/2).toFixed(1)}" y="${padT}" width="${Math.max(step,18).toFixed(1)}" height="${ih}" fill="transparent" data-tip="${esc(`<span class="tl">${esc(lb)}</span>${rows}`)}"/>`;
  });
  const leg=series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${g}</svg>
          <div class="legend">${leg}${cfg.extraLegend||''}</div>`;
}

/* diagram donat komposisi */
function donut(items,size){
  size = size||170;
  const total = items.reduce((s,i)=>s+Math.max(0,i.value),0) || 1;
  const cx=size/2, cy=size/2, r=size/2-4, ri=r*0.6;
  let ang=-Math.PI/2, g='';
  items.forEach(it=>{
    const frac = Math.max(0,it.value)/total;
    if(frac<=0) return;
    const a2 = ang + frac*Math.PI*2;
    const large = frac>0.5?1:0;
    const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    const x3=cx+ri*Math.cos(a2), y3=cy+ri*Math.sin(a2), x4=cx+ri*Math.cos(ang), y4=cy+ri*Math.sin(ang);
    g+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${ri} ${ri} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z" fill="${it.color}" data-tip="${esc(`<span class="tl">${esc(it.name)}</span><b>${rp(it.value)}</b><br>${nf1.format(frac*100)}% dari total`)}"/>`;
    ang=a2;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img">${g}</svg>`;
}

  return `<div class="kpi k-${cls}"${tip?` data-tip="${esc(tip)}"`:''}>

    ${detail?`<div class="dl">${detail}</div>`:''}

}
function th(cols){ return '<thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead>'; }

/* baris tabel P&L generik: nama | aktual | % | pembanding | selisih | % */
function lineRow(sheet,row,base,opt){
  opt=opt||{};

  const c = cur(sheet,row), r = ref(sheet,row);
  const pctC = base? ratio(c,base.c):null, pctR = base? ratio(r,base.r):null;

/* strip ledger 12 bulan — elemen tanda tangan aplikasi */
function ledgerStrip(getVal, opts){
  opts=opts||{};
  const y=state.year, ms=monthsIn(y);
  const vals = ms.map(m=>isClosed(y,m)?getVal(m):null);
  const fin = vals.filter(x=>x!==null&&isFinite(x));
  const max = Math.max(...fin,0)||1, min = Math.min(...fin,0);
  const span = (max-min)||1;
  const W=1200,H=54,gap=4;
  const bw=(W-gap*(ms.length-1))/ms.length;
  let g='';
  ms.forEach((m,i)=>{
    const x=i*(bw+gap);
    const val=vals[i];
    const active = m===state.month;
    if(val===null){
      g+=`<rect x="${x.toFixed(1)}" y="4" width="${bw.toFixed(1)}" height="${H-14}" fill="none" stroke="#C6CFD7" stroke-width="1" stroke-dasharray="3 3" rx="2" data-tip="${esc(`<span class="tl">${MONTHS[m-1]}</span>Belum closing — data biaya belum masuk`)}"/>`;
    }else{
      const h=Math.max(2,(val-min)/span*(H-16));
      g+=`<rect x="${x.toFixed(1)}" y="${(H-10-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${active?'#0D6E64':(opts.color||'#9BB3C0')}" rx="2" data-tip="${esc(`<span class="tl">${MONTHS[m-1]} ${y}</span>${opts.label||''}: <b>${(opts.fmt||rp)(val)}</b>`)}"/>`;
    }
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-1}" text-anchor="middle" font-size="8.5" font-family="IBM Plex Mono, monospace" fill="${active?'#0D6E64':'#8B9AA6'}" font-weight="${active?'600':'400'}">${MSHORT[m-1]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:56px" role="img">${g}</svg>`;
}

function narrFB(){
  const y=state.year,m=state.month;
  if(!isClosed(y,m)) return `Bulan ini belum closing. Analisa biaya baru bisa dilakukan setelah cost of sales, payroll, dan other expenses diposting ke file P&amp;L.`;
  const S=cur('fb',FB.salesTotal), Sr=ref('fb',FB.salesTotal);
  const F=cur('fb',FB.foodTotal), Bv=cur('fb',FB.bevTotal);
  const CF=cur('fb',FB.costFood), CB=cur('fb',FB.costBev);
  const fcPct=ratio(CF,F), fcR=ratio(ref('fb',FB.costFood),ref('fb',FB.foodTotal));
  const bcPct=ratio(CB,Bv), bcR=ratio(ref('fb',FB.costBev),ref('fb',FB.bevTotal));
  const DP=cur('fb',FB.deptProfit), DPr=ref('fb',FB.deptProfit);
  const banq=cur('fb',FB.fBanquet), resto=cur('fb',FB.fResto);
  const PAY=cur('fb',FB.payTotal), OEX=cur('fb',FB.oexTotal);
  const parts=[];
  parts.push(`Revenue F&amp;B ${periodLabel().toLowerCase()} mencapai ${rpjt(S)} atau ${grow(S,Sr)>=0?'lebih tinggi':'lebih rendah'} ${pc(Math.abs(grow(S,Sr)))} dari ${cmpLabel().toLowerCase()}.`);
  parts.push(`Banquet menyumbang ${pc(ratio(banq,S))} dari total sales dan De'Jawis Resto ${pc(ratio(resto,S))} — komposisi ini yang membuat naik-turunnya event banquet langsung terasa di department profit.`);
  parts.push(`Food cost berada di ${pc(fcPct,2)} (${fcPct<=fcR?'lebih baik':'lebih tinggi'} ${pc(Math.abs(fcPct-fcR),2).replace('%',' pp')} dari ${cmpLabel().toLowerCase()}), beverage cost ${pc(bcPct,2)}.`);
  parts.push(`Payroll menyerap ${pc(ratio(PAY,S))} dan other expenses ${pc(ratio(OEX,S))} dari revenue, menyisakan department profit ${rpjt(DP)} dengan margin ${pc(ratio(DP,S))} (${cmpLabel().toLowerCase()}: ${pc(ratio(DPr,Sr))}).`);
  return parts.join(' ');
}

function narrCOS(){
  const y=state.year,m=state.month;
  if(!isClosed(y,m)) return 'Bulan ini belum closing sehingga cost of sales belum bisa dianalisa.';
  const ms=closedMonths(y);
  const arr=ms.map(x=>({m:x,p:ratio(fb(FB.costFood,A,y,x),fb(FB.foodTotal,A,y,x))})).filter(o=>isFinite(o.p)&&o.p>0);
  const best=arr.reduce((a,b)=>b.p<a.p?b:a), worst=arr.reduce((a,b)=>b.p>a.p?b:a);
  const F=cur('fb',FB.foodTotal), CF=cur('fb',FB.costFood);
  const fcPct=ratio(CF,F), fcR=ratio(ref('fb',FB.costFood),ref('fb',FB.foodTotal));
  const gap=F*(fcPct-fcR)/100;
  return `Food cost ${periodLabel().toLowerCase()} ${pc(fcPct,2)} berbanding ${pc(fcR,2)} pada ${cmpLabel().toLowerCase()}; selisih ${pc(Math.abs(fcPct-fcR),2).replace('%',' pp')} setara ${rpjt(Math.abs(gap))} ${gap>0?'biaya tambahan':'penghematan'}. Sepanjang ${y} food cost paling rendah di ${MONTHS[best.m-1]} (${pc(best.p,2)}) dan paling tinggi di ${MONTHS[worst.m-1]} (${pc(worst.p,2)}) — selisih ${pc(worst.p-best.p,2).replace('%',' pp')} antar bulan menunjukkan bahwa yang bergerak bukan harga bahan, melainkan komposisi menu banquet, porsi, dan disiplin transfer antar outlet. Bulan dengan food cost tinggi perlu dicek ke tiga hal: paket banquet yang dijual di bawah harga standar, transfer store yang tidak dikembalikan, dan spoilage yang tidak dilaporkan.`;
}

function narrBiaya(overs,unders){

function narrBulan(y,m){
  if(!isClosed(y,m)) return `File ${MONTHS[m-1]} ${y} belum closing: kolom aktual hanya berisi proyeksi revenue, sedangkan cost of sales, payroll, dan other expenses masih nol. Analisa margin bulan ini menunggu proses closing selesai.`;
  const S=fb(FB.salesTotal,A,y,m), Sb=fb(FB.salesTotal,B,y,m), Sl=fb(FB.salesTotal,LY,y,m);
  const prev=m>1?m-1:null;
  const Sp=prev?fb(FB.salesTotal,A,y,prev):0;
  const DP=fb(FB.deptProfit,A,y,m), DPb=fb(FB.deptProfit,B,y,m);
  const fc=ratio(fb(FB.costFood,A,y,m),fb(FB.foodTotal,A,y,m));
  const banq=fb(FB.fBanquet,A,y,m), banqP=prev?fb(FB.fBanquet,A,y,prev):0;
  const out=[];
  out.push(`Revenue F&amp;B ${MONTHS[m-1]} ${y} sebesar ${rpjt(S)}: ${grow(S,Sb)>=0?'di atas':'di bawah'} budget ${pc(Math.abs(grow(S,Sb)))} dan ${grow(S,Sl)>=0?'naik':'turun'} ${pc(Math.abs(grow(S,Sl)))} dibanding bulan yang sama tahun lalu.`);
  if(prev) out.push(`Dibanding ${MONTHS[prev-1]}, revenue ${grow(S,Sp)>=0?'naik':'turun'} ${pc(Math.abs(grow(S,Sp)))} dan penggeraknya terutama banquet food yang bergerak dari ${rpjt(banqP)} ke ${rpjt(banq)}.`);
  out.push(`Food cost ditutup di ${pc(fc,2)} dan department profit ${rpjt(DP)} (margin ${pc(ratio(DP,S))}), ${grow(DP,DPb)>=0?'melampaui':'di bawah'} budget ${pc(Math.abs(grow(DP,DPb)))}.`);
  return out.join(' ');
}

function fullYears(){ return YEARS.filter(y=>closedMonths(y).length>=12); }

/* bulan yang sudah closing di SEMUA tahun — dasar perbandingan setara */
function commonMonths(){
  const per = YEARS.map(y=>new Set(closedMonths(y)));
  const out=[];
  for(let m=1;m<=12;m++) if(per.every(s=>s.has(m))) out.push(m);
  return out;
}
function isPartialYear(y){ return closedMonths(y).length<12; }
function anyPartial(){ return YEARS.some(isPartialYear); }

function yrSum(y,sheet,row,idx){
  const scope = (state.yoyScope==='setara') ? commonMonths() : monthsIn(y).filter(m=>isClosed(y,m));
  return scope.filter(m=>isClosed(y,m)).reduce((s,m)=>s+v(sheet,row,idx===undefined?A:idx,y,m),0);
}
function yrRange(y){
  if(state.yoyScope==='setara'){
    const c=commonMonths();
    return c.length===12 ? 'setahun penuh' : `${MSHORT[c[0]-1]}–${MSHORT[c[c.length-1]-1]}`;
  }
  const c=closedMonths(y);
  if(!c.length) return 'belum ada';
  return c.length===12 ? 'setahun penuh' : `${MSHORT[c[0]-1]}–${MSHORT[c[c.length-1]-1]}`;
}
function scopeLabel(){
  const c=commonMonths();
  return state.yoyScope==='setara'
    ? `${MONTHS[c[0]-1]}–${MONTHS[c[c.length-1]-1]} di setiap tahun`
    : 'seluruh bulan yang sudah closing di masing-masing tahun';
}

function narrTahun(a,b){
  const S=y=>yrSum(y,'fb',FB.salesTotal), DP=y=>yrSum(y,'fb',FB.deptProfit);
  const FC=y=>ratio(yrSum(y,'fb',FB.costFood),yrSum(y,'fb',FB.foodTotal));
  const BC=y=>ratio(yrSum(y,'fb',FB.costBev),yrSum(y,'fb',FB.bevTotal));
  const MG=y=>ratio(yrSum(y,'fb',FB.deptProfit),yrSum(y,'fb',FB.salesTotal));
  const banq=y=>yrSum(y,'fb',FB.fBanquet), resto=y=>yrSum(y,'fb',FB.fResto);
  const TR=y=>yrSum(y,'pl',PL.revTotal);
  const g=grow(S(a),S(b));
  /* bulan dengan perubahan terbesar */
  const rows=MSHORT.map((_,j)=>({m:j+1,d:(isClosed(a,j+1)&&isClosed(b,j+1))?grow(fb(FB.salesTotal,A,a,j+1),fb(FB.salesTotal,A,b,j+1)):null})).filter(r=>r.d!==null);
  const up=rows.reduce((x,z)=>z.d>x.d?z:x), dn=rows.reduce((x,z)=>z.d<x.d?z:x);
  const ag=Math.abs(g);
  const arah = ag<2 ? `praktis sejajar dengan ${b} (${rpjt(S(b))})`
             : `${g>=0?'naik':'turun'} ${pc(ag)} dari ${b} (${rpjt(S(b))})`;
  const bq=ratio(banq(a),S(a)), bqb=ratio(banq(b),S(b)), dbq=bq-bqb;
  const bqTxt = Math.abs(dbq)<1.5 ? 'nyaris tak berubah'
              : dbq>0 ? `makin dalam` : `mengendur tajam`;
  const dmg=MG(a)-MG(b);
  return `Revenue F&amp;B ${a} sebesar ${rpjt(S(a))}, ${arah}, sementara revenue hotel ${grow(TR(a),TR(b))>=0?'naik':'turun'} ${pc(Math.abs(grow(TR(a),TR(b))))}. Department profit ${rpjt(DP(a))} dengan margin ${pc(MG(a))} berbanding ${pc(MG(b))} di ${b} — ${Math.abs(dmg)<0.5?'praktis sama':(dmg>0?`naik ${nf1.format(dmg)} pp`:`tergerus ${nf1.format(Math.abs(dmg))} pp`)}. Food cost ${pc(FC(a),2)} vs ${pc(FC(b),2)}, beverage cost ${pc(BC(a),2)} vs ${pc(BC(b),2)}. Ketergantungan pada banquet ${bqTxt}: ${pc(bq)} di ${a} berbanding ${pc(bqb)} di ${b}, sedangkan De'Jawis Resto ${grow(resto(a),resto(b))>=0?'naik':'turun'} ${pc(Math.abs(grow(resto(a),resto(b))))}. Perubahan bulanan paling ekstrem: ${MONTHS[up.m-1]} ${up.d>=0?'+':''}${nf1.format(up.d)}% dan ${MONTHS[dn.m-1]} ${nf1.format(dn.d)}%.`;
}

const RM = {

  revRoom:23, revNoShow:24, revExtra:25, revDisc:26, revTotal:27,

};
const RM_PAY=[29,30,32,33,34,35,36];
const RM_OEX=(()=>{const a=[];for(let r=39;r<=76;r++)a.push(r);return a;})();

function rmHas(y,m){ return ROOM.years[y] && ROOM.years[y][String(m)]; }
function rm(row,idx,y,m){
  const md = rmHas(y,m); if(!md) return 0;
  const r = md[String(row)];
  return r ? (r[idx===undefined?A:idx]||0) : 0;
}
function rmMonths(y){ return Object.keys(ROOM.years[y]||{}).map(Number).sort((a,b)=>a-b); }
function rmClosed(y,m){ return rmHas(y,m) && (rm(RM.payTotal,A,y,m)>0 || rm(RM.oexTotal,A,y,m)>0); }
function rmClosedMonths(y){ return rmMonths(y).filter(m=>rmClosed(y,m)); }
function rmLbl(row){ return (ROOM.labels[String(row)]||'').trim(); }
const RM_YEARS = Object.keys(ROOM.years).sort();

/* rentang bulan aktif untuk tab ini */
function rmScopeMonths(y){
  const s=state.roomFrom, e=state.roomTo;
  return rmClosedMonths(y).filter(m=>m>=s&&m<=e);
}
function rmSum(y,row,idx){ return rmScopeMonths(y).reduce((s,m)=>s+rm(row,idx===undefined?A:idx,y,m),0); }
function rmScopeLabel(){
  const s=state.roomFrom,e=state.roomTo;
  return s===e ? MONTHS[s-1] : `${MONTHS[s-1]}–${MONTHS[e-1]}`;
}
/* metrik turunan */
function rmARR(y){ const o=rmSum(y,RM.occRoom); return o?rmSum(y,RM.revRoom)/o:0; }
function rmOcc(y){ const a=rmSum(y,RM.avail); return a?rmSum(y,RM.occRoom)/a*100:0; }
function rmRevPAR(y){ const a=rmSum(y,RM.avail); return a?rmSum(y,RM.revRoom)/a:0; }
function rmTRevPAR(y){ const a=rmSum(y,RM.avail); return a?rmSum(y,RM.revTotal)/a:0; }
function rmMargin(y){ const t=rmSum(y,RM.revTotal); return t?rmSum(y,RM.deptProfit)/t*100:0; }
function rmGuestPer(y){ const o=rmSum(y,RM.occRoom); return o?rmSum(y,RM.guest)/o:0; }

function tabRoom(){
  const ys=RM_YEARS;
  const yA=state.roomYear, iA=ys.indexOf(yA);
  const yB=iA>0?ys[iA-1]:null;                       /* tahun pembanding */
  const COLORS=['#2F4A7A','#0D6E64','#9A6B23','#A4243B'];
  const cmA=rmScopeMonths(yA);

  let h=`<div class="eyebrow">Sheet 01.1 Room Div &amp; 01. Profit &amp; Lost OK</div>
    <h2 class="ph">Room Division</h2>
    <p class="lead">Tab ini berdiri sendiri: pilih tahun dan rentang bulannya di bawah, tanpa mengubah pengaturan di bagian atas halaman. Semua tahun yang tersedia ditampilkan berdampingan pada rentang bulan yang sama.</p>`;

  /* ---- filter ---- */
  h+=`<div class="card mt"><div class="bd" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)">Tahun sorotan</span>
    <div class="seg" style="background:#EEF2F5;border-color:var(--line);padding:2px">
      ${ys.map(y=>`<button class="btn" data-ryear="${y}" style="${y===yA?'background:var(--teal);border-color:var(--teal);color:#fff':''}">${y}</button>`).join('')}
    </div>
    <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-left:8px">Bulan</span>
    <select id="rFrom" class="btn" style="padding:7px 10px">${MONTHS.map((n,i)=>`<option value="${i+1}"${i+1===state.roomFrom?' selected':''}>${n}</option>`).join('')}</select>
    <span class="dim">sampai</span>
    <select id="rTo" class="btn" style="padding:7px 10px">${MONTHS.map((n,i)=>`<option value="${i+1}"${i+1===state.roomTo?' selected':''}>${n}</option>`).join('')}</select>
    <button class="btn" data-rpreset="ytd">Sampai bulan terakhir</button>
    <button class="btn" data-rpreset="full">Setahun</button>
    <span class="dim" style="font-size:12px;margin-left:auto">Rentang aktif: <strong>${rmScopeLabel()}</strong> &middot; ${ys.map(y=>`${y}: ${rmScopeMonths(y).length} bln`).join(' &middot; ')}</span>
  </div></div>`;

  if(!cmA.length) return h+`<div class="banner mt">Tidak ada bulan yang sudah closing pada rentang ini untuk tahun ${yA}. Geser pilihan bulannya.</div>`;

  const short = ys.filter(y=>rmScopeMonths(y).length && rmScopeMonths(y).length<cmA.length);
  if(short.length) h+=`<div class="banner mt"><strong>Perhatian.</strong> Pada rentang ${rmScopeLabel()}, ${short.map(y=>`${y} hanya punya ${rmScopeMonths(y).length} bulan closing`).join(' dan ')}. Kolom tahun tersebut tidak sebanding penuh dengan ${yA}.</div>`;

  /* ---- KPI ---- */
  const tot=rmSum(yA,RM.revTotal), totB=yB?rmSum(yB,RM.revTotal):0;
  const dp=rmSum(yA,RM.deptProfit), dpB=yB?rmSum(yB,RM.deptProfit):0;
  const budTot=rmSum(yA,RM.revTotal,B);
  h+=`<div class="grid g4 mt">
    ${kpi('indigo','Total room sales '+yA,rpjt(tot),
      yB?`${chip(tot,totB,true)} <span class="dim">vs ${yB} ${rpjt(totB)}</span>`:'<span class="dim">tidak ada pembanding</span>',
      `Budget ${rpjt(budTot)} → ${chip(tot,budTot,true)}`)}
    ${kpi('teal','ARR',rp(rmARR(yA)),
      yB?`${chip(rmARR(yA),rmARR(yB),true)} <span class="dim">vs ${rp(rmARR(yB))}</span>`:'',
      `Room revenue ${rpjt(rmSum(yA,RM.revRoom))} dibagi ${nf.format(rmSum(yA,RM.occRoom))} kamar terjual`)}
    ${kpi('brass','Okupansi',pc(rmOcc(yA),2),
      yB?`${chipPP(rmOcc(yA),rmOcc(yB),true)} <span class="dim">vs ${pc(rmOcc(yB),2)}</span>`:'',
      `${nf.format(rmSum(yA,RM.occRoom))} dari ${nf.format(rmSum(yA,RM.avail))} kamar tersedia`)}
    ${kpi('clay','RevPAR',rp(rmRevPAR(yA)),
      yB?`${chip(rmRevPAR(yA),rmRevPAR(yB),true)} <span class="dim">vs ${rp(rmRevPAR(yB))}</span>`:'',
      `TRevPAR ${rp(rmTRevPAR(yA))} &middot; termasuk extra revenue`)}
  </div>`;
  h+=`<div class="grid g4 mt">
    ${kpi('teal','Department profit',rpjt(dp),
      yB?`${chip(dp,dpB,true)} <span class="dim">margin ${pc(rmMargin(yA))}</span>`:`<span class="dim">margin ${pc(rmMargin(yA))}</span>`,
      yB?`${chipPP(rmMargin(yA),rmMargin(yB),true)} terhadap margin ${yB} ${pc(rmMargin(yB))}`:'')}
    ${kpi('brass','Payroll room',rpjt(rmSum(yA,RM.payTotal)),
      `${chip(rmSum(yA,RM.payTotal),rmSum(yA,RM.payTotal,B),false)} vs budget <span class="dim">${pc(ratio(rmSum(yA,RM.payTotal),tot))} dari sales</span>`,'')}
    ${kpi('brass','Other expenses room',rpjt(rmSum(yA,RM.oexTotal)),
      `${chip(rmSum(yA,RM.oexTotal),rmSum(yA,RM.oexTotal,B),false)} vs budget <span class="dim">${pc(ratio(rmSum(yA,RM.oexTotal),tot))} dari sales</span>`,'')}
    ${kpi('indigo','Tamu per kamar',nf2.format(rmGuestPer(yA)),
      yB?`<span class="dim">${yB}: ${nf2.format(rmGuestPer(yB))}</span>`:'',
      `${nf.format(rmSum(yA,RM.guest))} tamu &middot; house use ${nf.format(rmSum(yA,RM.houseUse))} &middot; compliment ${nf.format(rmSum(yA,RM.compRoom))} kamar`)}
  </div>`;

  /* ---- rasio antar tahun ---- */
  const mets=[
    ['Total room sales',y=>rmSum(y,RM.revTotal),rp,true],
    ['Room revenue',y=>rmSum(y,RM.revRoom),rp,true],
    ['Rooms other extra revenue',y=>rmSum(y,RM.revExtra),rp,true],
    ['Kamar terjual',y=>rmSum(y,RM.occRoom),n=>nf.format(n),true],
    ['Kamar tersedia',y=>rmSum(y,RM.avail),n=>nf.format(n),null],
    ['Okupansi %',y=>rmOcc(y),n=>pc(n,2),true],
    ['ARR',y=>rmARR(y),rp,true],
    ['RevPAR',y=>rmRevPAR(y),rp,true],
    ['TRevPAR',y=>rmTRevPAR(y),rp,true],
    ['Jumlah tamu',y=>rmSum(y,RM.guest),n=>nf.format(n),true],
    ['Tamu per kamar',y=>rmGuestPer(y),n=>nf2.format(n),null],
    ['House use (kamar)',y=>rmSum(y,RM.houseUse),n=>nf.format(n),false],
    ['Compliment room (kamar)',y=>rmSum(y,RM.compRoom),n=>nf.format(n),false],
    ['Payroll % sales',y=>ratio(rmSum(y,RM.payTotal),rmSum(y,RM.revTotal)),n=>pc(n,2),false],
    ['Other expenses % sales',y=>ratio(rmSum(y,RM.oexTotal),rmSum(y,RM.revTotal)),n=>pc(n,2),false],
    ['Department profit',y=>rmSum(y,RM.deptProfit),rp,true],
    ['Margin department profit %',y=>rmMargin(y),n=>pc(n,2),true]
  ];
  h+=`<div class="card mt"><div class="hd"><h3>Room Division antar tahun — ${rmScopeLabel()}</h3><span class="hint">semua tahun pada rentang bulan yang sama</span></div>
    <div class="bd tight"><table class="t">${th(['Ukuran'].concat(ys).concat([yB?`&Delta; ${yA} vs ${yB}`:'&Delta;']))}<tbody>
    ${mets.map(([nm,fn,f,good])=>{
      const vals=ys.map(fn);
      const a=fn(yA), bv=yB?fn(yB):0;
      const isPct=/\%$/.test(nm);
      let d='<span class="delta flat">—</span>';
      if(yB) d = good===null ? `<span class="delta flat">${bv?((a-bv>=0?'+':'')+nf1.format(grow(a,bv))+'%'):'—'}</span>`
                             : (isPct ? chipPP(a,bv,good) : chip(a,bv,good));
      const isKey=/Total room sales|Department profit|Margin/.test(nm);
      return `<tr class="${isKey?'tot':''}"><td>${nm}</td>${vals.map((x,i)=>`<td class="n${ys[i]===yA?'':' dim'}">${f(x)}</td>`).join('')}<td class="n">${d}</td></tr>`;
    }).join('')}
    </tbody></table></div>
  </div>`;

  /* ---- laporan penuh sheet room div ---- */
  h+=`<div class="card mt"><div class="hd"><h3>Laporan lengkap sheet 01.1 Room Div — ${yA}, ${rmScopeLabel()}</h3><span class="hint">aktual vs budget${yB?` vs ${yB}`:''}</span></div>
    <div class="bd tight"><div class="scroll"><table class="t">${th(['Uraian','Aktual','% sales','Budget','&Delta;'].concat(yB?[yB,'&Delta;']:[]))}<tbody>
    ${(()=>{
      const groups=[['Statistik',[RM.arr,RM.avail,RM.occRoom,RM.payRoom,RM.houseUse,RM.compRoom,RM.guest],true,false],
                    ['Room sales',[RM.revRoom,RM.revNoShow,RM.revExtra,RM.revDisc,RM.revTotal],true,true],
                    ['Payroll & related',RM_PAY.concat([RM.payTotal]),false,true],
                    ['Other expenses',RM_OEX.concat([RM.oexTotal]),false,true],
                    ['Hasil',[RM.expTotal,RM.deptProfit],true,true]];
      return groups.map(([g,rows,good,showPct])=>secRow(g,yB?7:5)+rows.map(r=>{
        const a=rmSum(yA,r), bu=rmSum(yA,r,B), pv=yB?rmSum(yB,r):0;
        if(a===0&&bu===0&&pv===0) return '';
        const isStat=g==='Statistik';
        const fmtv=x=>isStat&&r!==RM.arr?nf.format(Math.round(x)):nf.format(Math.round(x));
        const isTot=/TOTAL|PROFIT/i.test(rmLbl(r));
        const gd = r===RM.expTotal ? false : good;
        return `<tr class="${isTot?(r===RM.deptProfit||r===RM.revTotal?'grand':'tot'):''}">
          <td>${esc(rmLbl(r))}</td><td class="n">${fmtv(a)}</td>
          <td class="n dim">${showPct&&rmSum(yA,RM.revTotal)?pc(ratio(a,rmSum(yA,RM.revTotal)),2):''}</td>
          <td class="n dim">${fmtv(bu)}</td><td class="n">${chip(a,bu,gd)}</td>
          ${yB?`<td class="n dim">${fmtv(pv)}</td><td class="n">${chip(a,pv,gd)}</td>`:''}</tr>`;
      }).join('')).join('');
    })()}
    </tbody></table></div></div>
  </div>`;

  /* ---- grafik bulanan ---- */
  const lbs=MSHORT.slice(state.roomFrom-1,state.roomTo);
  const rangeM=[]; for(let m=state.roomFrom;m<=state.roomTo;m++) rangeM.push(m);
  h+=`<div class="card mt"><div class="hd"><h3>Total room sales bulan demi bulan</h3><span class="hint">semua tahun &middot; arahkan kursor ke batang</span></div>
    <div class="bd">${barChart({labels:lbs,height:300,
      series:ys.map((y,i)=>({name:y,color:COLORS[i%COLORS.length],
        values:rangeM.map(m=>rmClosed(y,m)?rm(RM.revTotal,A,y,m):0)}))})}
    </div>
  </div>`;

  h+=`<div class="grid g2 mt">
    <div class="card"><div class="hd"><h3>Okupansi per bulan</h3><span class="hint">%</span></div>
      <div class="bd">${lineChart({labels:lbs,height:250,
        series:ys.map((y,i)=>({name:y,color:COLORS[i%COLORS.length],width:2.3,
          values:rangeM.map(m=>rmClosed(y,m)?rm(RM.occPct,A,y,m):null)}))})}
      </div>
    </div>
    <div class="card"><div class="hd"><h3>ARR per bulan</h3><span class="hint">rupiah</span></div>
      <div class="bd">${barChart({labels:lbs,height:250,fmt:n=>nf.format(Math.round(n/1000))+' rb',
        series:ys.map((y,i)=>({name:y,color:COLORS[i%COLORS.length],
          values:rangeM.map(m=>rmClosed(y,m)?rm(RM.arr,A,y,m):0)}))})}
      </div>
    </div>
  </div>`;

  /* ---- tabel bulanan: kenaikan bulan ke bulan + YoY ---- */
  h+=`<div class="card mt"><div class="hd"><h3>Kenaikan bulan ke bulan — ${yA}</h3><span class="hint">MoM = vs bulan sebelumnya, YoY = vs bulan yang sama ${yB||'tahun lalu'}</span></div>
    <div class="bd tight"><div class="scroll"><table class="t">${th(['Bulan','Room sales','MoM','YoY','Okupansi','&Delta; okup','ARR','&Delta; ARR','RevPAR','Dept profit','Margin','Bacaan'])}<tbody>
    ${rangeM.filter(m=>rmClosed(yA,m)).map((m,i,arr)=>{
      const p=i>0?arr[i-1]:null;
      const s=rm(RM.revTotal,A,yA,m), sp=p?rm(RM.revTotal,A,yA,p):null;
      const sly=yB&&rmClosed(yB,m)?rm(RM.revTotal,A,yB,m):null;
      const oc=rm(RM.occPct,A,yA,m), ocp=p?rm(RM.occPct,A,yA,p):null;
      const ar=rm(RM.arr,A,yA,m), arp=p?rm(RM.arr,A,yA,p):null;
      const av=rm(RM.avail,A,yA,m);
      const dpv=rm(RM.deptProfit,A,yA,m);
      let verdict='—',pill='b';
      if(p){
        const gs=grow(s,sp), go=oc-ocp, ga=grow(ar,arp);
        if(gs>=0&&ga>=0) { verdict='Harga & volume naik'; pill='g'; }
        else if(gs>=0&&ga<0){ verdict='Naik karena volume'; pill='y'; }
        else if(gs<0&&ga>=0){ verdict='Turun volume, harga jaga'; pill='y'; }
        else { verdict='Turun dua-duanya'; pill='r'; }
      }
      return `<tr><td><strong>${MONTHS[m-1]}</strong></td>
        <td class="n">${nf.format(Math.round(s))}</td>
        <td class="n">${p?`<span class="delta ${s>=sp?'up':'down'}">${s>=sp?'+':''}${nf1.format(grow(s,sp))}%</span>`:'<span class="dim">—</span>'}</td>
        <td class="n">${sly!==null?chip(s,sly,true):'<span class="dim">—</span>'}</td>
        <td class="n">${pc(oc,1)}</td>
        <td class="n">${p?chipPP(oc,ocp,true):'<span class="dim">—</span>'}</td>
        <td class="n">${nf.format(Math.round(ar))}</td>
        <td class="n">${p?chip(ar,arp,true):'<span class="dim">—</span>'}</td>
        <td class="n">${av?nf.format(Math.round(rm(RM.revRoom,A,yA,m)/av)):'—'}</td>
        <td class="n">${nf.format(Math.round(dpv))}</td>
        <td class="n"><strong>${pc(ratio(dpv,s))}</strong></td>
        <td><span class="pill ${pill}">${verdict}</span></td></tr>`;
    }).join('')}
    <tr class="grand"><td>${rmScopeLabel()}</td>
      <td class="n">${nf.format(Math.round(tot))}</td><td class="n">—</td>
      <td class="n">${yB?chip(tot,totB,true):'—'}</td>
      <td class="n">${pc(rmOcc(yA),1)}</td><td class="n">${yB?chipPP(rmOcc(yA),rmOcc(yB),true):'—'}</td>
      <td class="n">${nf.format(Math.round(rmARR(yA)))}</td><td class="n">${yB?chip(rmARR(yA),rmARR(yB),true):'—'}</td>
      <td class="n">${nf.format(Math.round(rmRevPAR(yA)))}</td>
      <td class="n">${nf.format(Math.round(dp))}</td><td class="n">${pc(rmMargin(yA))}</td><td></td></tr>
    </tbody></table></div></div>
  </div>`;

  /* ---- kamar vs F&B ---- */
  h+=`<div class="grid g2 mt">
    <div class="card"><div class="hd"><h3>Kamar dan F&amp;B berjalan seiring?</h3><span class="hint">${yA}, ${rmScopeLabel()}</span></div>
      <div class="bd">${barChart({labels:lbs,height:250,
        series:[{name:'Room sales',color:'#2F4A7A',values:rangeM.map(m=>rmClosed(yA,m)?rm(RM.revTotal,A,yA,m):0)},
                {name:'Revenue F&B',color:'#0D6E64',values:rangeM.map(m=>isClosed(yA,m)?fb(FB.salesTotal,A,yA,m):0)}]})}
        <p class="dim" style="font-size:12px;margin:8px 0 0">Kalau kamar naik tapi F&amp;B tidak ikut, artinya tamu yang menginap belum tertangkap di restoran dan room service — itu peluang yang bisa dikejar tanpa menambah tamu baru.</p>
      </div>
    </div>
    <div class="card"><div class="hd"><h3>Belanja F&amp;B per kamar terjual</h3><span class="hint">revenue F&amp;B dibagi kamar terjual</span></div>
      <div class="bd">${lineChart({labels:lbs,height:250,
        series:ys.map((y,i)=>({name:y,color:COLORS[i%COLORS.length],width:2.3,
          values:rangeM.map(m=>{
            if(!rmClosed(y,m)||!isClosed(y,m)) return null;
            const o=rm(RM.occRoom,A,y,m); return o?fb(FB.salesTotal,A,y,m)/o/1000:null;
          })}))
        })}
        <p class="dim" style="font-size:12px;margin:8px 0 0">Satuan: ribu rupiah per kamar terjual. Angka ini naik bila banquet ramai, jadi bacalah bersama porsi banquet di tab F&amp;B.</p>
      </div>
    </div>
  </div>`;

  /* ---- other expenses room ---- */
  const oex=RM_OEX.map(r=>({row:r,name:rmLbl(r),a:rmSum(yA,r),b:rmSum(yA,r,B),p:yB?rmSum(yB,r):0}))
                  .filter(o=>o.a||o.b||o.p).sort((x,z)=>z.a-x.a);
  const maxAbs=Math.max(...oex.map(o=>Math.abs(o.a-o.b)),1);
  h+=`<div class="card mt"><div class="hd"><h3>Other expenses Room Division</h3><span class="hint">${yA}, ${rmScopeLabel()} &middot; bar menunjukkan selisih terhadap budget</span></div>
    <div class="bd tight"><div class="scroll"><table class="t">${th(['Pos biaya','Aktual','% sales','Budget','Selisih vs budget','&Delta;'].concat(yB?[yB,'&Delta; YoY']:[]))}<tbody>
    ${oex.map(o=>`<tr><td>${esc(o.name)}</td>
      <td class="n">${nf.format(Math.round(o.a))}</td>
      <td class="n dim">${pc(ratio(o.a,tot),2)}</td>
      <td class="n dim">${nf.format(Math.round(o.b))}</td>
      <td class="n bar-cell ${o.a-o.b<=0?'pos':'neg'}"><span class="fill ${o.a-o.b>0?'neg':''}" style="width:${(Math.abs(o.a-o.b)/maxAbs*100).toFixed(1)}%"></span><span>${o.a-o.b>=0?'+':''}${nf.format(Math.round(o.a-o.b))}</span></td>
      <td class="n">${chip(o.a,o.b,false)}</td>
      ${yB?`<td class="n dim">${nf.format(Math.round(o.p))}</td><td class="n">${chip(o.a,o.p,false)}</td>`:''}</tr>`).join('')}
    <tr class="grand"><td>TOTAL OTHER EXPENSES</td>
      <td class="n">${nf.format(Math.round(rmSum(yA,RM.oexTotal)))}</td>
      <td class="n">${pc(ratio(rmSum(yA,RM.oexTotal),tot),2)}</td>
      <td class="n">${nf.format(Math.round(rmSum(yA,RM.oexTotal,B)))}</td>
      <td class="n">${rmSum(yA,RM.oexTotal)-rmSum(yA,RM.oexTotal,B)>=0?'+':''}${nf.format(Math.round(rmSum(yA,RM.oexTotal)-rmSum(yA,RM.oexTotal,B)))}</td>
      <td class="n">${chip(rmSum(yA,RM.oexTotal),rmSum(yA,RM.oexTotal,B),false)}</td>
      ${yB?`<td class="n">${nf.format(Math.round(rmSum(yB,RM.oexTotal)))}</td><td class="n">${chip(rmSum(yA,RM.oexTotal),rmSum(yB,RM.oexTotal),false)}</td>`:''}</tr>
    </tbody></table></div></div>
  </div>`;

  h+=`<div class="note-box mt teal"><h4>Bacaan Room Division <span class="edit-hint">bisa diedit</span></h4>
    ${ed('room-'+yA+'-'+state.roomFrom+'-'+state.roomTo,narrRoom(yA,yB))}</div>`;
  return h;
}

function narrRoom(yA,yB){
  const tot=rmSum(yA,RM.revTotal), dp=rmSum(yA,RM.deptProfit);
  const budTot=rmSum(yA,RM.revTotal,B);
  if(!yB) return `Total room sales ${rmScopeLabel()} ${yA} sebesar ${rpjt(tot)} dengan okupansi ${pc(rmOcc(yA),2)}, ARR ${rp(rmARR(yA))}, dan RevPAR ${rp(rmRevPAR(yA))}. Department profit ${rpjt(dp)} atau ${pc(rmMargin(yA))} dari room sales. Terhadap budget, room sales ${grow(tot,budTot)>=0?'di atas':'di bawah'} ${pc(Math.abs(grow(tot,budTot)))}.`;
  const totB=rmSum(yB,RM.revTotal);
  const dOcc=rmOcc(yA)-rmOcc(yB), gArr=grow(rmARR(yA),rmARR(yB)), gRev=grow(tot,totB);
  let mesin;
  if(dOcc>=0&&gArr>=0) mesin=`Keduanya bergerak searah — okupansi naik ${nf1.format(dOcc)} pp dan ARR naik ${pc(gArr)} — jadi pertumbuhan datang dari volume sekaligus harga.`;
  else if(dOcc<0&&gArr>0) mesin=`Okupansi turun ${nf1.format(Math.abs(dOcc))} pp tetapi ARR naik ${pc(gArr)}: kamar terjual lebih sedikit dengan harga lebih baik. Ini menguntungkan margin kamar, namun mengecilkan basis tamu in-house yang bisa dijual ke restoran dan room service.`;
  else if(dOcc>0&&gArr<0) mesin=`Okupansi naik ${nf1.format(dOcc)} pp tetapi ARR turun ${pc(Math.abs(gArr))}: pertumbuhan ditopang diskon, bukan permintaan yang menguat.`;
  else mesin=`Okupansi turun ${nf1.format(Math.abs(dOcc))} pp dan ARR juga turun ${pc(Math.abs(gArr))} — tekanan datang dari dua sisi sekaligus.`;
  return `Pada ${rmScopeLabel()}, total room sales ${yA} ${rpjt(tot)}, ${gRev>=0?'naik':'turun'} ${pc(Math.abs(gRev))} dari ${yB} (${rpjt(totB)}), dan ${grow(tot,budTot)>=0?'di atas':'di bawah'} budget ${pc(Math.abs(grow(tot,budTot)))}. ${mesin} RevPAR bergerak dari ${rp(rmRevPAR(yB))} ke ${rp(rmRevPAR(yA))}. Department profit ${rpjt(dp)} dengan margin ${pc(rmMargin(yA))} berbanding ${pc(rmMargin(yB))} — biaya kamar ${grow(rmSum(yA,RM.expTotal),rmSum(yB,RM.expTotal))>=0?'naik':'turun'} ${pc(Math.abs(grow(rmSum(yA,RM.expTotal),rmSum(yB,RM.expTotal))))}. Belanja F&amp;B per kamar terjual ${(()=>{const oA=rmSum(yA,RM.occRoom),oB=rmSum(yB,RM.occRoom);const fA=rmScopeMonths(yA).reduce((s,m)=>s+fb(FB.salesTotal,A,yA,m),0),fB2=rmScopeMonths(yB).reduce((s,m)=>s+fb(FB.salesTotal,A,yB,m),0);if(!oA||!oB)return 'belum bisa dihitung';return `${rp(fA/oA)} berbanding ${rp(fB2/oB)} di ${yB}`;})()}.`;
}

function tabTren(){
  const y=state.year, ms=closedMonths(y), tl=ms.map(x=>MSHORT[x-1]);

  const openM=all.filter(x=>!isClosed(y,x));

  const rows=ms.map((x,i)=>{
    const p = i>0 ? ms[i-1] : null;
    const S=fb(FB.salesTotal,A,y,x), COS=fb(FB.cosTotal,A,y,x), PAY=fb(FB.payTotal,A,y,x), OEX=fb(FB.oexTotal,A,y,x);
    const DP=fb(FB.deptProfit,A,y,x), TOT=COS+PAY+OEX;
    const pS=p?fb(FB.salesTotal,A,y,p):null, pTOT=p?(fb(FB.cosTotal,A,y,p)+fb(FB.payTotal,A,y,p)+fb(FB.oexTotal,A,y,p)):null;
    const pDP=p?fb(FB.deptProfit,A,y,p):null;
    return {m:x,S,COS,PAY,OEX,TOT,DP,
      gS:p?grow(S,pS):null, gT:p?grow(TOT,pTOT):null, gDP:p?grow(DP,pDP):null,
      margin:ratio(DP,S), pMargin:p?ratio(pDP,pS):null,
      fc:ratio(fb(FB.costFood,A,y,x),fb(FB.foodTotal,A,y,x)),

  if(openM.length) h+=`<div class="banner mt"><strong>${openM.map(x=>MONTHS[x-1]).join(' dan ')} ${y} belum closing</strong> dan tidak dimasukkan ke perhitungan tren, karena kolom biayanya masih nol di file sumber. Tren di bawah memakai ${MONTHS[ms[0]-1]}–${MONTHS[ms[ms.length-1]-1]}.</div>`;

    <div class="bd tight"><div class="scroll"><table class="t">${th(['Bulan','Revenue F&amp;B','&Delta; revenue','Total biaya','&Delta; biaya','Dept profit','&Delta; profit','Margin','&Delta; margin','Food cost %','Bev cost %','Bacaan'])}<tbody>
    ${rows.map(r=>{
      let verdict='—', pill='b';
      if(r.gS!==null){
        if(r.gS>=0 && r.gT<=r.gS){ verdict='Sehat'; pill='g'; }
        else if(r.gS>=0 && r.gT>r.gS){ verdict='Biaya lari'; pill='y'; }
        else if(r.gS<0 && r.gT<=r.gS){ verdict='Biaya ikut turun'; pill='b'; }
        else { verdict='Perlu koreksi'; pill='r'; }
      }
      return `<tr${r.m===state.month?' style="background:#F0F6F5"':''}>
        <td><strong>${MONTHS[r.m-1]}</strong></td>
        <td class="n">${nf.format(Math.round(r.S))}</td>
        <td class="n">${r.gS===null?'<span class="dim">—</span>':`<span class="delta ${r.gS>=0?'up':'down'}">${r.gS>=0?'+':''}${nf1.format(r.gS)}%</span>`}</td>
        <td class="n">${nf.format(Math.round(r.TOT))}</td>
        <td class="n">${r.gT===null?'<span class="dim">—</span>':`<span class="delta ${r.gT<=0?'up':'down'}">${r.gT>=0?'+':''}${nf1.format(r.gT)}%</span>`}</td>
        <td class="n">${nf.format(Math.round(r.DP))}</td>
        <td class="n">${r.gDP===null?'<span class="dim">—</span>':`<span class="delta ${r.gDP>=0?'up':'down'}">${r.gDP>=0?'+':''}${nf1.format(r.gDP)}%</span>`}</td>

        <td class="n">${r.pMargin===null?'<span class="dim">—</span>':chipPP(r.margin,r.pMargin,true)}</td>
        <td class="n">${pc(r.fc,2)}</td><td class="n">${pc(r.bc,2)}</td>
        <td><span class="pill ${pill}">${verdict}</span></td></tr>`;

    </tbody></table></div></div>
  </div>`;

  h+=`<div class="card mt"><div class="hd"><h3>Revenue dan biaya bergerak bersama?</h3><span class="hint">persentase perubahan dari bulan sebelumnya</span></div>
    <div class="bd">${barChart({labels:tl.slice(1),height:260,fmt:n=>nf1.format(n)+'%',tipFmt:n=>nf1.format(n)+'%',

        series:[

    </div>

      <div class="bd">${barChart({labels:tl,height:240,
        series:[
          {name:'Revenue hotel',color:'#2F4A7A',values:ms.map(x=>pl(PL.revTotal,A,y,x))},
          {name:'Revenue F&B',color:'#0D6E64',values:ms.map(x=>fb(FB.salesTotal,A,y,x))}

    </div>
  </div>`;

  /* tabel hotel MoM */
  h+=`<div class="card mt"><div class="hd"><h3>Sisi hotel — bulan ke bulan</h3><span class="hint">sheet 01. Profit &amp; Lost OK</span></div>
    <div class="bd tight"><table class="t">${th(['Bulan','Revenue hotel','&Delta;','Kamar','F&amp;B','Okupansi','ARR','GOP','&Delta; GOP','Margin GOP'])}<tbody>
    ${ms.map((x,i)=>{

      return `<tr${x===state.month?' style="background:#F0F6F5"':''}><td><strong>${MONTHS[x-1]}</strong></td>
        <td class="n">${nf.format(Math.round(TR))}</td>
        <td class="n">${p?`<span class="delta ${TR>=pTR?'up':'down'}">${TR>=pTR?'+':''}${nf1.format(grow(TR,pTR))}%</span>`:'<span class="dim">—</span>'}</td>

        <td class="n">${nf.format(Math.round(GOP))}</td>
        <td class="n">${p?`<span class="delta ${GOP>=pGOP?'up':'down'}">${GOP>=pGOP?'+':''}${nf1.format(grow(GOP,pGOP))}%</span>`:'<span class="dim">—</span>'}</td>
        <td class="n"><strong>${pc(ratio(GOP,TR))}</strong></td></tr>`;

  h+=`<div class="note-box mt teal"><h4>Bacaan tren ${y} <span class="edit-hint">bisa diedit</span></h4>
    ${ed('tren-'+y,narrTren(rows))}</div>`;
  return h;
}

function narrTren(rows){
  if(rows.length<2) return 'Belum cukup bulan yang closing untuk membaca tren.';
  const best=rows.reduce((a,b)=>b.margin>a.margin?b:a);
  const worst=rows.reduce((a,b)=>b.margin<a.margin?b:a);
  const risk=rows.filter(r=>r.gS!==null&&r.gT>r.gS&&r.gS>0);
  const y=state.year;
  const first=rows[0], last=rows[rows.length-1];
  return `Sepanjang ${MONTHS[first.m-1]}–${MONTHS[last.m-1]} ${y}, margin department profit F&amp;B bergerak dari ${pc(first.margin)} ke ${pc(last.margin)}. Bulan terbaik ${MONTHS[best.m-1]} dengan margin ${pc(best.margin)} (revenue ${rpjt(best.S)}, food cost ${pc(best.fc,2)}), bulan terlemah ${MONTHS[worst.m-1]} dengan margin ${pc(worst.margin)} (food cost ${pc(worst.fc,2)}). ${risk.length?`Ada ${risk.length} bulan di mana revenue naik tetapi biaya naik lebih cepat — ${risk.map(r=>MONTHS[r.m-1]).join(', ')}. Di bulan-bulan itu tambahan omzet tidak berubah menjadi tambahan profit, dan itulah titik yang perlu ditutup lebih dulu sebelum mengejar volume baru.`:'Tidak ada bulan di mana biaya tumbuh lebih cepat dari revenue saat revenue naik — pengendalian biaya sudah mengikuti irama penjualan.'}`;
}

/* ============================================================
   TAB BUKBER — analisa penjualan buka puasa bersama 2023-2026
   Sumber: Restaurant Transaction Journal per outlet (De'Jawis & Banquet),
   periode laporan = rentang puasa tiap tahun.
   ============================================================ */
const BK = window.__BK || {years:[],desc:[],guest:[],tx:[],pot:{},start:{},end:{},lebaran:{}};
const BKY = BK.years;
const BK_TX = BK.tx.map(r=>({
  y:BKY[r[0]], o:r[1]?'Banquet':"De'Jawis", d:r[2], p:r[3], w:r[4],
  desc:BK.desc[r[5]], g:r[6]>=0?BK.guest[r[6]]:'', q:r[7], a:r[8], c:r[9], t:r[10]
}));
const BK_MAXP = BK_TX.reduce((m,t)=>Math.max(m,t.p),1);
const BK_DOW = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const BK_COL = {'2023':'#2F4A7A','2024':'#0D6E64','2025':'#9A6B23','2026':'#A4243B'};
/* Angka di jurnal transaksi masih kotor: sudah termasuk service charge 10% dan
   government tax 11% (faktor gabungan 1,21). Nett revenue = kotor / 1,21. */
const BK_TAX = 1.21;
function bkNet(a){ return a/BK_TAX; }
/* c: 1 = item bukber, 0 = paket banquet lain jam buka, 2 = compliment/entertain */
function bkJenis(c){ return c===2?'compliment / entertain' : c===0?'paket lain' : 'bukber'; }
function bkTaxPart(a){ return a - a/BK_TAX; }
function bkM(a){ return state.bkNet ? a/BK_TAX : a; }          /* ikut mode tampilan */
function bkMode(){ return state.bkNet ? 'nett' : 'kotor'; }
function bkModeNote(){ return state.bkNet ? 'nett, setelah service charge 10% + tax 11%' : 'kotor, masih termasuk service charge 10% + tax 11%'; }

function bkInit(){ if(!state.bkYears||!state.bkYears.length) state.bkYears=BKY.slice();
  if(state.bkNet===undefined||state.bkNet===null) state.bkNet=false;
  if(state.bkComp===undefined||state.bkComp===null) state.bkComp=false;
  if(!state.bkTo||state.bkTo>BK_MAXP) state.bkTo=BK_MAXP;
  if(!state.bkFrom||state.bkFrom<1) state.bkFrom=1; }
function bkYearsSel(){ bkInit(); const s=state.bkYears.filter(y=>BKY.indexOf(y)>=0); return s.length?s:BKY.slice(); }
function bkQ(){ return (state.bkQ||'').trim().toUpperCase(); }
function bkBase(){ return BK_TX.filter(t=> t.c===1 || (t.c===0 && state.bkOther) || (t.c===2 && state.bkComp) ); }
function bkFilter(over){
  over = over||{};
  const yrs = over.years || bkYearsSel();
  const q = over.q!==undefined ? over.q : bkQ();
  const from = over.from!==undefined ? over.from : state.bkFrom;
  const to   = over.to!==undefined   ? over.to   : state.bkTo;
  return bkBase().filter(t=>{
    if(yrs.indexOf(t.y)<0) return false;
    if(state.bkOutlet!=='all' && t.o!==state.bkOutlet) return false;
    if(t.p<from || t.p>to) return false;
    if(q && (t.g.toUpperCase().indexOf(q)<0 && t.desc.toUpperCase().indexOf(q)<0)) return false;
    return true;
  });
}
function bkAgg(list){
  /* pax hanya dihitung dari baris penjualan; baris compliment tidak menambah pax
     karena pax-nya sudah terhitung di baris penjualannya */
  let q=0,a=0,comp=0; const days={}; let n=0;
  list.forEach(t=>{ if(t.c!==2){ q+=t.q; days[t.d]=1; n++; } else comp+=t.a; a+=t.a; });
  return {q:q, a:a, comp:comp, days:Object.keys(days).length, n:n, avg:q?a/q:0};
}
function bkCompRows(over){ /* baris compliment sesuai filter, terlepas dari tombolnya */
  over=over||{};
  const yrs=over.years||bkYearsSel(), q=bkQ();
  return BK_TX.filter(t=> t.c===2 && yrs.indexOf(t.y)>=0
    && (state.bkOutlet==='all'||t.o===state.bkOutlet)
    && t.p>=state.bkFrom && t.p<=state.bkTo
    && (!q || t.g.toUpperCase().indexOf(q)>=0 || t.desc.toUpperCase().indexOf(q)>=0));
}
function bkCompSum(yrsOrOver){ return bkCompRows(yrsOrOver).reduce((s,t)=>s+t.a,0); }
function bkPot(yrs,key){ return yrs.reduce((s,y)=>s+((BK.pot[y]&&BK.pot[y][key])||0),0); }
function bkDate(iso){
  const p=iso.split('-'); return p[2]+' '+MSHORT[(+p[1])-1]+' '+p[0].slice(2);
}
function bkPrice(y){
  /* harga paket dewasa yang paling sering dipakai pada tahun itu */
  const c={};
  BK_TX.filter(t=>t.c===1 && t.y===y && t.q>0 && !/CHILD|ANAK/i.test(t.desc)).forEach(t=>{
    const u=Math.round(t.a/t.q/1000)*1000; c[u]=(c[u]||0)+t.q;
  });
  let best=0,bv=-1; Object.keys(c).forEach(k=>{ if(c[k]>bv){bv=c[k];best=+k;} });
  return best;
}
function bkNormName(g){ return g||'(tanpa nama)'; }

function bkGuestTable(list){
  const m={};
  list.forEach(t=>{
    const g=bkNormName(t.g);
    if(!m[g]) m[g]={name:g,q:0,a:0,n:0,free:0,years:{},last:'',first:'zzzz'};
    const r=m[g]; r.a+=t.a; r.years[t.y]=1;
    if(t.c===2){ r.free+=(-t.a); } else { r.q+=t.q; r.n++; }
    if(t.d>r.last) r.last=t.d; if(t.d<r.first) r.first=t.d;
  });
  let arr=Object.keys(m).map(k=>m[k]);
  arr.forEach(r=>{ r.ys=Object.keys(r.years).sort(); });
  if(state.bkRepeat) arr=arr.filter(r=>r.ys.length>1 && r.name!=='(tanpa nama)');
  const s=state.bkSort;
  arr.sort((x,z)=> s==='nama' ? x.name.localeCompare(z.name)
               : s==='rev'  ? z.a-x.a
               : s==='visit'? (z.n-x.n)||(z.q-x.q)
               : s==='tahun'? (z.ys.length-x.ys.length)||(z.q-x.q)
               : z.q-x.q );
  return arr;
}
